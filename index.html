              </ResponsiveContainer>
              <div style={{ display: 'flex', gap: 20, marginTop: 12, flexWrap: 'wrap' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12 }}>
                  <div style={{ width: 16, height: 3, background: C.blue, borderRadius: 1 }} />
                  <span style={{ color: C.textMut }}>P/B Ratio (left axis)</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12 }}>
                  <div style={{ width: 16, height: 2, background: '#a78bfa', borderRadius: 1, borderTop: '1px dashed #a78bfa' }} />
                  <span style={{ color: C.textMut }}>ROE % (right axis)</span>
                </div>
                <span className="mono" style={{ fontSize: 11, color: C.textMut, marginLeft: 'auto' }}>ROE = (P/B ÷ P/E) × 100</span>
              </div>
            </ChartCard>
          </div>
          )}

          {/* Phase 5.5: Quarterly TTM EPS — rendered on ALL tabs (Nifty 50, all sectors, all globals).
              Sits immediately below the main valuation charts and is period-scoped to the master toggle. */}
          <QuarterlyEpsChart data={data} indexLabel={indexConfig.shortLabel} period={period} customStartISO={customStartISO} />

          {/* RSI + FII side-by-side (Nifty 50: FII chart; others: RSI full-width) */}
          <div className="charts-grid" style={{ marginTop: 24 }}>
            <RSIModule data={data} activeIndex={activeIndex} period={period} customStartISO={customStartISO} />
            {!isSectorIndex(activeIndex) && taaConfig && erpChartData.length > 0 && (
              <ChartCard title={taaConfig.fiiLabel} subtitle="With 1σ and 2σ bands"
                badge={erpChartData.length > 0 && erpChartData[erpChartData.length-1].fii != null ? erpChartData[erpChartData.length-1].fii.toFixed(1) + '%' : 'N/A'}
                badgeColor={C.green} badgeBg="rgba(34,197,94,0.15)">
                <ResponsiveContainer width="100%" height={400}>
                  <ComposedChart data={erpChartData} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
                    <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={Math.max(1, Math.floor(erpChartData.length / 8))} stroke={C.grid} />
                    <YAxis domain={fiiDomain} ticks={fiiTicks} tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => v + '%'} />
                    <Tooltip content={<Tip fields={[{ key: 'fii', label: taaConfig ? taaConfig.fiiLabel.split(' ').slice(0, 3).join(' ') : 'Positioning', color: C.green, suffix: '%' }]} />} />
                    <ReferenceLine y={(fiiStats || EMPTY_STATS).sd2Upper} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+2σ (' + fmt2((fiiStats || EMPTY_STATS).sd2Upper) + ')', position: 'insideTopRight', fill: C.red, fontSize: 10 }} />
                    <ReferenceLine y={(fiiStats || EMPTY_STATS).sd1Upper} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+1σ (' + fmt2((fiiStats || EMPTY_STATS).sd1Upper) + ')', position: 'insideTopRight', fill: C.amber, fontSize: 10 }} />
                    <ReferenceLine y={(fiiStats || EMPTY_STATS).mean} stroke={C.purple} strokeWidth={1.5} strokeDasharray="6 4" label={{ value: 'Mean (' + fmt2((fiiStats || EMPTY_STATS).mean) + ')', position: 'insideTopRight', fill: C.purple, fontSize: 10 }} />
                    <ReferenceLine y={(fiiStats || EMPTY_STATS).sd1Lower} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−1σ (' + fmt2((fiiStats || EMPTY_STATS).sd1Lower) + ')', position: 'insideBottomRight', fill: C.amber, fontSize: 10 }} />
                    <ReferenceLine y={(fiiStats || EMPTY_STATS).sd2Lower} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−2σ (' + fmt2((fiiStats || EMPTY_STATS).sd2Lower) + ')', position: 'insideBottomRight', fill: C.red, fontSize: 10 }} />
                    <Line type="monotone" dataKey="fii" stroke={C.green} strokeWidth={2} dot={false} isAnimationActive={false} />
                  </ComposedChart>
                </ResponsiveContainer>
                <div style={{ fontSize: 12, color: C.textMut, marginTop: 8, lineHeight: 1.5 }}>{taaConfig.fiiExplainer}</div>
              </ChartCard>
            )}
          </div>

          {/* Breadth + MCap/GDP side-by-side (broad market only — gated off sector tabs per Phase-3 'less is more') */}
          {!isSectorIndex(activeIndex) && taaConfig && breadthMcapChartData.length > 0 && (
            <div className="charts-grid" style={{ marginTop: 24 }}>
              <ChartCard title={'Market Breadth (% of ' + (taaConfig ? taaConfig.breadthUniverse : 'Index') + ' > 200 DMA)'} subtitle="With 1σ and 2σ bands"
                badge={breadthMcapChartData.length > 0 && breadthMcapChartData[breadthMcapChartData.length-1].breadth != null ? breadthMcapChartData[breadthMcapChartData.length-1].breadth.toFixed(1) + '%' : 'N/A'}
                badgeColor={C.blue} badgeBg="rgba(59,130,246,0.15)">
                <ResponsiveContainer width="100%" height={400}>
                  <ComposedChart data={breadthMcapChartData} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
                    <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={bmTickInterval} stroke={C.grid} />
                    <YAxis domain={breadthDomain} ticks={breadthTicks} tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => v + '%'} />
                    <Tooltip content={<Tip fields={[{ key: 'breadth', label: 'Breadth', color: C.blue, suffix: '%' }]} />} />
                    <ReferenceLine y={(breadthStats || EMPTY_STATS).sd2Upper} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+2σ (' + (breadthStats || EMPTY_STATS).sd2Upper.toFixed(1) + ')', position: 'insideTopRight', fill: C.red, fontSize: 10 }} />
                    <ReferenceLine y={(breadthStats || EMPTY_STATS).sd1Upper} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+1σ (' + (breadthStats || EMPTY_STATS).sd1Upper.toFixed(1) + ')', position: 'insideTopRight', fill: C.amber, fontSize: 10 }} />
                    <ReferenceLine y={(breadthStats || EMPTY_STATS).mean} stroke={C.purple} strokeWidth={1.5} strokeDasharray="6 4" label={{ value: 'Mean (' + (breadthStats || EMPTY_STATS).mean.toFixed(1) + ')', position: 'insideTopRight', fill: C.purple, fontSize: 10 }} />
                    <ReferenceLine y={(breadthStats || EMPTY_STATS).sd1Lower} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−1σ (' + (breadthStats || EMPTY_STATS).sd1Lower.toFixed(1) + ')', position: 'insideBottomRight', fill: C.amber, fontSize: 10 }} />
                    <ReferenceLine y={(breadthStats || EMPTY_STATS).sd2Lower} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−2σ (' + (breadthStats || EMPTY_STATS).sd2Lower.toFixed(1) + ')', position: 'insideBottomRight', fill: C.red, fontSize: 10 }} />
                    <Line type="monotone" dataKey="breadth" stroke={C.blue} strokeWidth={2} dot={false} isAnimationActive={false} />
                  </ComposedChart>
                </ResponsiveContainer>
                <div style={{ fontSize: 12, color: C.textMut, marginTop: 8, lineHeight: 1.5 }}>{taaConfig ? taaConfig.breadthExplainer : ''}</div>
              </ChartCard>

              <ChartCard title="Market Cap to GDP (%)" subtitle={"With 1σ and 2σ bands"}
                badge={breadthMcapChartData.length > 0 && breadthMcapChartData[breadthMcapChartData.length-1].mcap != null ? breadthMcapChartData[breadthMcapChartData.length-1].mcap.toFixed(0) + '%' : 'N/A'}
                badgeColor={C.amber} badgeBg="rgba(245,158,11,0.15)">
                <ResponsiveContainer width="100%" height={400}>
                  <ComposedChart data={breadthMcapChartData} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
                    <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={bmTickInterval} stroke={C.grid} />
                    <YAxis domain={mcapDomain} ticks={mcapTicks} tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => v + '%'} />
                    <Tooltip content={<Tip fields={[{ key: 'mcap', label: 'MCap/GDP', color: C.amber, suffix: '%' }]} />} />
                    <ReferenceLine y={(mcapStats || EMPTY_STATS).sd2Upper} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+2σ (' + (mcapStats || EMPTY_STATS).sd2Upper.toFixed(0) + '%)', position: 'insideTopRight', fill: C.red, fontSize: 10 }} />
                    <ReferenceLine y={(mcapStats || EMPTY_STATS).sd1Upper} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+1σ (' + (mcapStats || EMPTY_STATS).sd1Upper.toFixed(0) + '%)', position: 'insideTopRight', fill: C.amber, fontSize: 10 }} />
                    <ReferenceLine y={(mcapStats || EMPTY_STATS).mean} stroke={C.purple} strokeWidth={1.5} strokeDasharray="6 4" label={{ value: 'Mean (' + (mcapStats || EMPTY_STATS).mean.toFixed(0) + '%)', position: 'insideTopRight', fill: C.purple, fontSize: 10 }} />
                    <ReferenceLine y={(mcapStats || EMPTY_STATS).sd1Lower} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−1σ (' + (mcapStats || EMPTY_STATS).sd1Lower.toFixed(0) + '%)', position: 'insideBottomRight', fill: C.amber, fontSize: 10 }} />
                    <ReferenceLine y={(mcapStats || EMPTY_STATS).sd2Lower} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−2σ (' + (mcapStats || EMPTY_STATS).sd2Lower.toFixed(0) + '%)', position: 'insideBottomRight', fill: C.red, fontSize: 10 }} />
                    <Line type="monotone" dataKey="mcap" stroke={C.amber} strokeWidth={2} dot={false} isAnimationActive={false} />
                  </ComposedChart>
                </ResponsiveContainer>
                <div style={{ fontSize: 12, color: C.textMut, marginTop: 8, lineHeight: 1.5 }}>{taaConfig ? taaConfig.mcapGdpExplainer : ''}</div>
              </ChartCard>
            </div>
          )}

          {/* Phase-5: Quarterly EPS + PEG dual-axis chart — non-sector tabs render here (below P/E charts).
              Sector tabs render below the Relative P/E charts further down. */}
          {/* Phase 5.3: Daily PEG chart removed; QuarterlyEpsChart now lives ONLY in the sector branch
              (immediately below the ROE vs P/B Overlay) per the new layout spec. */}

          {/* TAA Module — broad market only (sectors get Relative Valuation instead) */}
          {/* Phase 5.5: TAAModule (heatmaps + Polarity Config Panel) removed per UI-simplification spec. */}

          {/* Relative Valuation Ratio Charts — every sector tab vs Nifty 50 baseline */}
          {isSectorIndex(activeIndex) && ratioChartData.length > 0 && (() => {
            // Strip weight-percent annotations (e.g. "Financials (35.5%)" → "Financials") for clean chart titles
            const sectorTitle = (indexConfig.shortLabel || indexConfig.label || '').replace(/\s*\([^)]*\)\s*$/, '').trim();
            return (
            <React.Fragment>
            <div className="charts-grid" style={{ marginTop: 24 }}>
              <ChartCard
                title={sectorTitle + " P/E ÷ Nifty 50 P/E"}
                subtitle={"Relative P/E valuation ratio with 1σ and 2σ bands"}
                badge={filteredRatio.length > 0 ? filteredRatio[filteredRatio.length - 1].peRatio.toFixed(2) + 'x' : 'N/A'}
                badgeColor={C.cyan} badgeBg="rgba(34,211,238,0.15)"
              >
                <ResponsiveContainer width="100%" height={400}>
                  <ComposedChart key={'peRatio-'+period} data={ratioChartData} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
                    <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={ratioTickInterval} stroke={C.grid} />
                    <YAxis domain={peRatioDomain} ticks={peRatioTicks} tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => v.toFixed(2) + 'x'} />
                    <Tooltip content={<Tip fields={[
                      { key: 'peRatio', label: 'P/E Ratio', color: C.cyan, suffix: 'x' },
                      { key: 'peRatioMean', label: 'Mean', color: C.purple, suffix: 'x' },
                    ]} />} />
                    <ReferenceLine y={(ratioStats?.pe || EMPTY_STATS).sd2Upper} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+2σ (' + fmt2((ratioStats?.pe || EMPTY_STATS).sd2Upper) + ')', position: 'insideTopRight', fill: C.red, fontSize: 10 }} />
                    <ReferenceLine y={(ratioStats?.pe || EMPTY_STATS).sd1Upper} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+1σ (' + fmt2((ratioStats?.pe || EMPTY_STATS).sd1Upper) + ')', position: 'insideTopRight', fill: C.amber, fontSize: 10 }} />
                    <ReferenceLine y={(ratioStats?.pe || EMPTY_STATS).mean} stroke={C.purple} strokeWidth={1.5} strokeDasharray="6 4" label={{ value: 'Mean (' + fmt2((ratioStats?.pe || EMPTY_STATS).mean) + ')', position: 'insideTopRight', fill: C.purple, fontSize: 10 }} />
                    <ReferenceLine y={(ratioStats?.pe || EMPTY_STATS).sd1Lower} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−1σ (' + fmt2((ratioStats?.pe || EMPTY_STATS).sd1Lower) + ')', position: 'insideBottomRight', fill: C.amber, fontSize: 10 }} />
                    <ReferenceLine y={(ratioStats?.pe || EMPTY_STATS).sd2Lower} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−2σ (' + fmt2((ratioStats?.pe || EMPTY_STATS).sd2Lower) + ')', position: 'insideBottomRight', fill: C.red, fontSize: 10 }} />
                    <Line type="monotone" dataKey="peRatio" stroke={C.cyan} strokeWidth={2} dot={false} isAnimationActive={false} />
                  </ComposedChart>
                </ResponsiveContainer>
                <ZoneLegend stats={ratioStats.pe} suffix="x" />
              </ChartCard>

              <ChartCard
                title={sectorTitle + " P/B ÷ Nifty 50 P/B"}
                subtitle={"Relative P/B valuation ratio with 1σ and 2σ bands"}
                badge={filteredRatio.length > 0 ? filteredRatio[filteredRatio.length - 1].pbRatio.toFixed(2) + 'x' : 'N/A'}
                badgeColor={C.blue} badgeBg="rgba(59,130,246,0.15)"
              >
                <ResponsiveContainer width="100%" height={400}>
                  <ComposedChart key={'pbRatio-'+period} data={ratioChartData} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
                    <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={ratioTickInterval} stroke={C.grid} />
                    <YAxis domain={pbRatioDomain} ticks={pbRatioTicks} tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => v.toFixed(2) + 'x'} />
                    <Tooltip content={<Tip fields={[
                      { key: 'pbRatio', label: 'P/B Ratio', color: C.blue, suffix: 'x' },
                      { key: 'pbRatioMean', label: 'Mean', color: C.purple, suffix: 'x' },
                    ]} />} />
                    <ReferenceLine y={(ratioStats?.pb || EMPTY_STATS).sd2Upper} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+2σ (' + fmt2((ratioStats?.pb || EMPTY_STATS).sd2Upper) + ')', position: 'insideTopRight', fill: C.red, fontSize: 10 }} />
                    <ReferenceLine y={(ratioStats?.pb || EMPTY_STATS).sd1Upper} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+1σ (' + fmt2((ratioStats?.pb || EMPTY_STATS).sd1Upper) + ')', position: 'insideTopRight', fill: C.amber, fontSize: 10 }} />
                    <ReferenceLine y={(ratioStats?.pb || EMPTY_STATS).mean} stroke={C.purple} strokeWidth={1.5} strokeDasharray="6 4" label={{ value: 'Mean (' + fmt2((ratioStats?.pb || EMPTY_STATS).mean) + ')', position: 'insideTopRight', fill: C.purple, fontSize: 10 }} />
                    <ReferenceLine y={(ratioStats?.pb || EMPTY_STATS).sd1Lower} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−1σ (' + fmt2((ratioStats?.pb || EMPTY_STATS).sd1Lower) + ')', position: 'insideBottomRight', fill: C.amber, fontSize: 10 }} />
                    <ReferenceLine y={(ratioStats?.pb || EMPTY_STATS).sd2Lower} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−2σ (' + fmt2((ratioStats?.pb || EMPTY_STATS).sd2Lower) + ')', position: 'insideBottomRight', fill: C.red, fontSize: 10 }} />
                    <Line type="monotone" dataKey="pbRatio" stroke={C.blue} strokeWidth={2} dot={false} isAnimationActive={false} />
                  </ComposedChart>
                </ResponsiveContainer>
                <ZoneLegend stats={ratioStats.pb} suffix="x" />
              </ChartCard>
            </div>
            {/* Analyst explainer — Relative Valuation context */}
            <div style={{ margin: '16px 0 0 0', padding: '14px 18px', borderLeft: '3px solid ' + C.border, borderRadius: '0 8px 8px 0', background: 'rgba(148,163,184,0.04)' }}>
              <p style={{ fontSize: 13, lineHeight: 1.7, color: C.textMut, margin: 0, fontStyle: 'italic' }}>
                <span style={{ fontWeight: 600, color: C.textSec }}>Relative Valuation Note:</span>{' '}
                Relative P/B (Spread) cancels out broad market beta noise and highlights true mean reversion. Absolute P/B may remain elevated during secular bull markets driven by the structural financialization of savings. The relative ratio specifically identifies when sector exuberance decouples from fundamental opportunity cost, providing a higher-conviction TAA signal.
              </p>
            </div>
            {/* Phase 5.3: Daily PEG removed; Quarterly EPS already rendered above (under ROE/PB). */}
            </React.Fragment>
            );
          })()}

          </React.Fragment>)}{/* end inIndiaMacroHub / inGlobalMacroHub conditional */}

          {/* Footer */}
          <div style={{ textAlign: 'center', padding: '24px 0', fontSize: 12, color: C.textMut, borderTop: '1px solid ' + C.border, marginTop: 32 }}>
            {inIndiaMacroHub
              ? 'India macro proxies: FRED (IIP, HH Cons., GFCF, CPI, ST Rate) & Yahoo (Nifty Services Sector). Auto-refreshes hourly.'
              : inGlobalMacroHub
              ? 'Macro data: Yahoo Finance (DXY, USD/JPY) & FRED (10Y-2Y Spread) · Trailing 12M ROC computed daily.'
              : <React.Fragment>Data sourced from NSE India (PE/PB) &amp; Investing.com (10Y G-Sec Yield) &bull; {indexConfig.label} from {dataStartLabel} &bull; {data.length.toLocaleString()} trading days</React.Fragment>}
            <br /><span style={{ opacity: 0.7 }}>Tusk Invest Research</span>
          </div>
        </div>
          )}
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
