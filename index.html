    // and the Liquidity↔MCap correlation chart.
    function GlobalMacroHub({ macroHistory, globalExtras, period, customStartISO }) {
      if (!macroHistory) {
        return (<div style={{ padding: '60px 24px', textAlign: 'center', color: C.textMut, fontSize: 14 }}>Loading global macro history…</div>);
      }
      const liqSliced  = applyPeriodFilter((globalExtras?.liquidity?.series || []).filter(d => d && d.value != null), period, customStartISO);
      const mcapSliced = applyPeriodFilter((globalExtras?.marketCap?.series || []).filter(d => d && d.value != null), period, customStartISO);
      const charts = [
        { key: 'dxy',   title: 'DXY — 12M Rate of Change',    dataKey: 'roc12m', suffix: '%', color: C.cyan,
          data: applyPeriodFilter((macroHistory.dxy || []).filter(d => d && d.roc12m != null), period, customStartISO),
          note: 'Measures Dollar liquidity. A rising DXY signals tightening global financial conditions and risk-off sentiment for Emerging Markets.' },
        { key: 'jpy',   title: 'USD/JPY — 12M Rate of Change', dataKey: 'roc12m', suffix: '%', color: C.amber,
          data: applyPeriodFilter((macroHistory.usdjpy || []).filter(d => d && d.roc12m != null), period, customStartISO),
          note: 'Tracks Yen Carry Trade dynamics. A rapidly strengthening Yen (negative ROC) flags global carry trade unwinds and institutional de-risking.' },
        { key: 'curve', title: 'US 10Y-2Y Yield Curve Spread', dataKey: 'value',  suffix: '%', color: C.purple,
          data: applyPeriodFilter((macroHistory.yieldCurve || []).filter(d => d && d.value != null), period, customStartISO),
          note: 'Leading macro indicator. Inversion (negative) signals recession risk; steepening (positive) signals economic reflation or late-cycle dynamics.' },
      ];
      return (
        <div>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: C.text, margin: '0 0 6px' }}>Global Macro Hub</h2>
          <p style={{ fontSize: 13, color: C.textMut, margin: '0 0 24px' }}>Period: <span className="mono" style={{ color: C.text, fontWeight: 600 }}>{period || 'All'}</span>{period === 'Date' && customStartISO ? <span className="mono"> (since {customStartISO})</span> : null} — institutional macro signals filtered to the master time toggle.</p>
          {/* Phase 5.7 — Combined Global Liquidity (WALCL + ECB) ↔ Global MCap (URTH) correlation. */}
          <CorrelationChart
            title="Global Liquidity ↔ Global MCap (URTH)"
            seriesA={liqSliced}
            seriesB={mcapSliced}
            labelA="Liquidity ($T)"
            labelB="MSCI World"
            colorA={C.green}
            colorB={C.blue}
            source={globalExtras?.liquidity_source ? globalExtras.liquidity_source + ' × ' + (globalExtras.marketCap_source || 'URTH') : 'FRED WALCL + ECBASSETSW × Yahoo URTH'}
            note="Phase 5.7 — Combined Fed + ECB balance sheets (proxy for the Bloomberg GLMOSUPP G-index) plotted against the MSCI World ETF. Sustained R² > 0.6 means the global liquidity tide is driving the rally; R² collapse warns that flows, not money, are running the cycle."
          />
          {charts.map(c => {
            // Phase-5: Mean / ±1σ / ±2σ over the visible time horizon for institutional reference bands.
            const vals = c.data.map(d => d[c.dataKey]).filter(v => v != null && isFinite(v));
            const stats = vals.length > 5 ? calcStats(vals) : EMPTY_STATS;
            return (
            <div key={c.key} style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: 24, marginBottom: 20 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12 }}>
                <h3 style={{ fontSize: 16, fontWeight: 600, color: C.text, margin: 0 }}>{c.title}</h3>
                <span className="mono" style={{ fontSize: 13, fontWeight: 700, color: c.color }}>
                  {c.data.length > 0 ? (c.data[c.data.length-1][c.dataKey] > 0 ? '+' : '') + (+c.data[c.data.length-1][c.dataKey]).toFixed(2) + c.suffix : 'n/a'}
                </span>
              </div>
              <ResponsiveContainer width="100%" height={300}>
                <ComposedChart data={c.data} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
                  <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={Math.max(1, Math.floor(c.data.length / 10))} stroke={C.grid} />
                  <YAxis tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => v + c.suffix} />
                  <Tooltip content={<Tip fields={[{ key: c.dataKey, label: c.title.split(' — ')[0], color: c.color, suffix: c.suffix }]} />} />
                  <ReferenceLine y={0} stroke={C.textMut} strokeWidth={1} />
                  {/* Phase-5: institutional ±2σ/±1σ/Mean reference bands. */}
                  <ReferenceLine y={stats.sd2Upper} stroke={C.red}    strokeWidth={1}   strokeDasharray="3 3" label={{ value: '+2σ (' + fmt2(stats.sd2Upper) + ')', position: 'insideTopRight',    fill: C.red,    fontSize: 10 }} />
                  <ReferenceLine y={stats.sd1Upper} stroke={C.amber}  strokeWidth={1}   strokeDasharray="3 3" label={{ value: '+1σ (' + fmt2(stats.sd1Upper) + ')', position: 'insideTopRight',    fill: C.amber,  fontSize: 10 }} />
                  <ReferenceLine y={stats.mean}     stroke={C.purple} strokeWidth={1.5} strokeDasharray="3 3" label={{ value: 'Mean ('+ fmt2(stats.mean)     + ')', position: 'insideTopRight',    fill: C.purple, fontSize: 10 }} />
                  <ReferenceLine y={stats.sd1Lower} stroke={C.amber}  strokeWidth={1}   strokeDasharray="3 3" label={{ value: '−1σ (' + fmt2(stats.sd1Lower) + ')', position: 'insideBottomRight', fill: C.amber,  fontSize: 10 }} />
                  <ReferenceLine y={stats.sd2Lower} stroke={C.red}    strokeWidth={1}   strokeDasharray="3 3" label={{ value: '−2σ (' + fmt2(stats.sd2Lower) + ')', position: 'insideBottomRight', fill: C.red,    fontSize: 10 }} />
                  <Line type="monotone" dataKey={c.dataKey} stroke={c.color} strokeWidth={2} dot={false} isAnimationActive={false} />
                </ComposedChart>
              </ResponsiveContainer>
              <div style={{ marginTop: 14, padding: '12px 16px', background: 'rgba(148,163,184,0.06)', borderLeft: '3px solid ' + c.color, borderRadius: '0 6px 6px 0' }}>
                <p style={{ fontSize: 12, lineHeight: 1.6, color: C.textSec, margin: 0 }}>
                  <span style={{ fontWeight: 700, color: C.text, fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Implication: </span>
                  {c.note}
                </p>
                <p className="mono" style={{ fontSize: 11, color: C.textMut, margin: '6px 0 0' }}>μ={fmt2(stats.mean)}{c.suffix} · σ={fmt2(stats.sd)}{c.suffix} · n={vals.length}</p>
              </div>
            </div>
            );
          })}
        </div>
      );
    }

    function StocksDashboard({ period, setPeriod, customStart, setCustomStart, customStartISO }) {
      // Phase 6.4 — Cascading screener: pick an Index, then a Company. Data fetched only when a company is picked.
      const [universe, setUniverse] = useState(null);
      const [selectedIndex, setSelectedIndex] = useState('');
      const [selectedTicker, setSelectedTicker] = useState('');
      const [dataCache, setDataCache] = useState({});
      const [loading, setLoading] = useState(false);
      const [listLoading, setListLoading] = useState(true);
      const [fetchError, setFetchError] = useState(null);
      // Phase 7.3 — Fundamental Snapshot (Yahoo quoteSummary) cache keyed by ticker.
      const [quoteCache, setQuoteCache] = useState({});
      const [quoteLoading, setQuoteLoading] = useState(false);
      // Backward-compat: stocksList is the array of {ticker,name} for the currently selected index.
      const stocksList = (universe && selectedIndex) ? (universe.tree[selectedIndex] || []) : [];

      // Phase 6.4 — Fetch the full universe tree (Index → constituents) once on mount.
      useEffect(() => {
        let cancelled = false;
        fetch(STOCKS_BASE + '?mode=stocks-universe&t=' + Date.now(), { cache: 'no-store' })
          .then(r => r.json())
          .then(u => {
            if (cancelled) return;
            if (u && u.tree && typeof u.tree === 'object') {
              setUniverse(u);
              const firstIdx = Object.keys(u.tree).find(k => (u.tree[k] || []).length > 0) || '';
              setSelectedIndex(firstIdx);
              setFetchError(null);
            } else {
              setFetchError(u && u.error ? String(u.error) : 'stocks-universe endpoint returned no data');
            }
            setListLoading(false);
          })
          .catch(e => { if (!cancelled) { setFetchError(String(e)); setListLoading(false); } });
        return () => { cancelled = true; };
      }, []);

      // Phase 6.4 — Clear the company selection whenever the index changes (cascading reset).
      useEffect(() => { setSelectedTicker(''); }, [selectedIndex]);

      // Phase 6 — Fetch data for the selected ticker. Defensive: missing rows[] never crashes the chart pipeline.
      useEffect(() => {
        if (!selectedTicker) return;
        if (dataCache[selectedTicker]) return;
        setLoading(true);
        let cancelled = false;
        fetch(STOCKS_BASE + '?mode=stocks-data&ticker=' + encodeURIComponent(selectedTicker) + '&t=' + Date.now(), { cache: 'no-store' })
          .then(r => r.json())
          .then(j => {
            if (cancelled) return;
            const processed = processStocksRows((j && Array.isArray(j.rows)) ? j.rows : []);
            setDataCache(prev => ({ ...prev, [selectedTicker]: processed }));
            setLoading(false);
          })
          .catch(e => { if (!cancelled) { setLoading(false); } });
        return () => { cancelled = true; };
      }, [selectedTicker]);

      // Phase 7.3 — Fetch Fundamental Snapshot (ROE / P/B / Trailing EPS) for the selected ticker.
      // Backend defensively returns fundamentals=null + error string on Yahoo failure so the UI degrades
      // to "N/A" instead of crashing.
      useEffect(() => {
        if (!selectedTicker) return;
        if (quoteCache[selectedTicker]) return;
        let cancelled = false;
        setQuoteLoading(true);
        fetch(STOCKS_BASE + '?mode=stocks-quote&ticker=' + encodeURIComponent(selectedTicker) + '&t=' + Date.now(), { cache: 'no-store' })
          .then(r => r.json())
          .then(j => { if (!cancelled) { setQuoteCache(prev => ({ ...prev, [selectedTicker]: j || null })); setQuoteLoading(false); } })
          .catch(() => { if (!cancelled) { setQuoteCache(prev => ({ ...prev, [selectedTicker]: null })); setQuoteLoading(false); } });
        return () => { cancelled = true; };
      }, [selectedTicker]);

      // Phase 6 — Force-refresh: drop cache + re-fetch current ticker (also re-pulls Yahoo max history).
      const refreshStock = useCallback(() => {
        if (!selectedTicker) return;
        setDataCache(prev => { const next = { ...prev }; delete next[selectedTicker]; return next; });
        setQuoteCache(prev => { const next = { ...prev }; delete next[selectedTicker]; return next; });
      }, [selectedTicker]);

      // Phase 6 — XLSX export of the currently filtered series (matches the time toggle).
      const downloadStock = useCallback(() => {
        if (typeof XLSX === 'undefined' || !selectedTicker) return;
        const rows = (dataCache[selectedTicker] || []).filter(d => d && d.date);
        const filteredRows = applyPeriodFilter(rows, period, customStartISO);
        const sheet = XLSX.utils.json_to_sheet(filteredRows.map(r => ({ date: r.date, close: r.close, pe: r.pe || null, pb: r.pb || null, eps_ttm: r.eps_ttm || null, bvps: r.bvps || null })));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, sheet, selectedTicker);
        XLSX.writeFile(wb, selectedTicker + '_' + (period || 'All') + '.xlsx');
      }, [dataCache, selectedTicker, period, customStartISO]);

      const data = dataCache[selectedTicker] || [];
      const stockMeta = stocksList.find(s => s.ticker === selectedTicker);

      const filtered = useMemo(() => {
        if (data.length === 0) return [];
        return applyPeriodFilter(data, period, customStartISO);
      }, [data, period, customStartISO]);

      // Only keep rows with valid values per-series
      const peRows = useMemo(() => filtered.filter(d => d.pe != null && d.pe > 0 && isFinite(d.pe)), [filtered]);
      const pbRows = useMemo(() => filtered.filter(d => d.pb != null && d.pb > 0 && isFinite(d.pb)), [filtered]);
      const priceRows = useMemo(() => filtered.filter(d => d.close != null && d.close > 0), [filtered]);

      // EMPTY_STATS is defined at module scope — no redeclaration (Babel var-hoist bug)
      const stats = useMemo(() => ({
        pe: peRows.length > 0 ? calcStats(peRows.map(x => x.pe)) : EMPTY_STATS,
        pb: pbRows.length > 0 ? calcStats(pbRows.map(x => x.pb)) : EMPTY_STATS,
        price: priceRows.length > 0 ? calcStats(priceRows.map(x => x.close)) : EMPTY_STATS,
      }), [peRows, pbRows, priceRows]);

      const latestRow = filtered.length > 0 ? filtered[filtered.length - 1] : null;
      const latestClose = priceRows.length > 0 ? priceRows[priceRows.length - 1].close : null;
      const latestPE = peRows.length > 0 ? peRows[peRows.length - 1].pe : null;
      const latestPB = pbRows.length > 0 ? pbRows[pbRows.length - 1].pb : null;
      const latestEY = latestPE && latestPE > 0 ? +(100 / latestPE).toFixed(2) : null;

      // Downsample helper for charts
      function sample(rows) {
        if (rows.length === 0) return [];
        const step = Math.max(1, Math.floor(rows.length / 300));
        const s = rows.filter((_, i) => i % step === 0);
        if (s.length > 0 && s[s.length - 1] !== rows[rows.length - 1]) s.push(rows[rows.length - 1]);
        return s;
      }

      const priceChart = useMemo(() => sample(priceRows).map(d => ({ ...d, priceMean: stats.price.mean })), [priceRows, stats.price.mean]);
      const peChart = useMemo(() => sample(peRows).map(d => ({ ...d, peMean: stats.pe.mean })), [peRows, stats.pe.mean]);
      const pbChart = useMemo(() => sample(pbRows).map(d => ({ ...d, pbMean: stats.pb.mean })), [pbRows, stats.pb.mean]);

      const priceDomain = useMemo(() => {
        const vals = priceChart.map(d => d.close).filter(v => v != null);
        if (vals.length === 0) return [0, 1];
        const mn = Math.min(...vals); const mx = Math.max(...vals);
        return [+mn.toFixed(2), +mx.toFixed(2)];
      }, [priceChart]);
      const priceTicks = useMemo(() => niceTicks(priceDomain[0], priceDomain[1], 5, 2), [priceDomain]);

      const peDomain = useMemo(() => {
        const vals = peChart.map(d => d.pe).filter(v => v != null);
        if (vals.length === 0) return [0, 1];
        const mn = Math.min(...vals); const mx = Math.max(...vals);
        return [+mn.toFixed(2), +mx.toFixed(2)];
      }, [peChart]);
      const peTicks = useMemo(() => niceTicks(peDomain[0], peDomain[1], 5, 2), [peDomain]);

      const pbDomain = useMemo(() => {
        const vals = pbChart.map(d => d.pb).filter(v => v != null);
        if (vals.length === 0) return [0, 1];
        const mn = Math.min(...vals); const mx = Math.max(...vals);
        return [+mn.toFixed(2), +mx.toFixed(2)];
      }, [pbChart]);
      const pbTicks = useMemo(() => niceTicks(pbDomain[0], pbDomain[1], 5, 2), [pbDomain]);

      const priceTickInterval = Math.max(1, Math.floor(priceChart.length / 8));
      const peTickInterval = Math.max(1, Math.floor(peChart.length / 8));
      const pbTickInterval = Math.max(1, Math.floor(pbChart.length / 8));

      if (listLoading) {
        return (
          <div style={{ padding: 24, maxWidth: 1400, margin: '0 auto', textAlign: 'center', paddingTop: 120 }}>
            <div style={{ fontSize: 18, color: C.textMut }}>Loading stocks universe...</div>
          </div>
        );
      }
      // Phase 9.3 — Guard against null-payload white-screen. If the universe endpoint failed or the master
      // tables are empty (stocks_master / stocks_daily not yet backfilled), surface a clean fallback rather
      // than letting downstream computations crash on undefined data.
      if (!universe || !universe.tree || Object.keys(universe.tree || {}).length === 0) {
        return (
          <div style={{ padding: 24, maxWidth: 1400, margin: '0 auto', paddingTop: 60 }}>
            <h1 style={{ fontSize: 28, fontWeight: 700, color: C.text, letterSpacing: '-0.02em' }}>Stocks Module</h1>
            <p style={{ fontSize: 14, color: C.textMut, marginTop: 6, marginBottom: 32 }}>
              Data temporarily unavailable.
            </p>
            <div style={{ padding: 28, background: C.card, border: '1px solid ' + C.border, borderRadius: 12, maxWidth: 720 }}>
              <div style={{ fontSize: 14, color: C.text, fontWeight: 600, marginBottom: 10 }}>
                Per-ticker fundamentals are loading from the upstream feed.
              </div>
              <div style={{ fontSize: 13, color: C.textSec, lineHeight: 1.6 }}>
                The Stocks universe (NSE constituents + Yahoo Finance fundamentals) is waiting on the next refresh cycle.
                You can continue to use the Indices and Macro tabs in the meantime.
              </div>
              {fetchError && (
                <div className="mono" style={{ marginTop: 16, padding: 10, background: '#fff', border: '1px solid ' + C.border, borderRadius: 8, fontSize: 11, color: C.textMut }}>
                  Diagnostic: {fetchError}
                </div>
              )}
            </div>
          </div>
        );
      }

      const latestDate = latestRow ? latestRow.date : '';
      const firstAvailable = data.length > 0 ? data[0].date : '';

      return (
        <div style={{ padding: 24, maxWidth: 1400, margin: '0 auto' }}>
          {/* Header */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 24, flexWrap: 'wrap', gap: 16 }}>
            <div>
              <h1 style={{ fontSize: 28, fontWeight: 700, color: C.text, letterSpacing: '-0.02em' }}>Equity Macro Dashboard</h1>
              <p style={{ fontSize: 14, color: C.textMut, marginTop: 6 }}>
                Stocks &bull; {stockMeta ? stockMeta.name : '...'} &bull; Data till: {latestDate ? new Date(latestDate).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '...'}
              </p>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
              <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                {PERIODS.filter(p => p.label !== 'Date').map(p => (
                  <button key={p.label} onClick={() => { setPeriod(p.label); setCustomStart(''); }}
                    style={{ background: period === p.label ? C.cyan : 'transparent', border: '1px solid ' + (period === p.label ? C.cyan : C.border), color: period === p.label ? '#ffffff' : C.textSec, borderRadius: 6, padding: '4px 10px', fontSize: 11, fontWeight: period === p.label ? 600 : 400, cursor: 'pointer', fontFamily: 'Inter, sans-serif' }}>
                    {p.label === 'All' ? 'MAX' : p.label}
                  </button>
                ))}
                <input
                  type="date"
                  value={customStartISO || ''}
                  onChange={e => {
                    const v = e.target.value;
                    if (v) {
                      const [y, m, d] = v.split('-');
                      setCustomStart(d + '-' + m + '-' + y);
                      setPeriod('Date');
                    } else {
                      setCustomStart('');
                      setPeriod('All');
                    }
                  }}
                  title="Pick a custom start date"
                  style={{ marginLeft: 2, background: period === 'Date' ? C.cyan : 'transparent', border: '1px solid ' + (period === 'Date' ? C.cyan : C.border), color: period === 'Date' ? '#ffffff' : C.textSec, borderRadius: 6, padding: '3px 8px', fontSize: 11, fontFamily: 'Inter, sans-serif', outline: 'none', cursor: 'pointer' }}
                />
              </div>
              {/* Phase 6 — Standardized Refresh + Download buttons matching the Nifty / Sector tabs. */}
              <button onClick={refreshStock} disabled={!selectedTicker || loading}
                style={{ background: 'transparent', border: '1px solid ' + C.border, color: C.textSec, borderRadius: 6, padding: '4px 10px', fontSize: 11, fontWeight: 600, cursor: (!selectedTicker || loading) ? 'not-allowed' : 'pointer', fontFamily: 'Inter, sans-serif', opacity: (!selectedTicker || loading) ? 0.5 : 1 }}>
                {loading ? '↻ Refreshing…' : '↻ Refresh'}
              </button>
              <button onClick={downloadStock} disabled={!selectedTicker || (dataCache[selectedTicker] || []).length === 0}
                style={{ background: 'transparent', border: '1px solid ' + C.border, color: C.textSec, borderRadius: 6, padding: '4px 10px', fontSize: 11, fontWeight: 600, cursor: 'pointer', fontFamily: 'Inter, sans-serif' }}>
                📥 XLSX
              </button>
            </div>
          </div>

          {/* Stock Selector Dropdown */}
          {/* Phase 6.4 — Cascading screener. Index list comes from the live NSE-scraped universe tree;
              picking an index populates the company dropdown; the stocks-data fetch only fires once a
              company is chosen, so the screener stays interactive even when Yahoo is slow. */}
          <div style={{ display: 'flex', gap: 12, alignItems: 'center', marginBottom: 24, flexWrap: 'wrap' }}>
            <label style={{ fontSize: 12, color: C.textMut, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Index</label>
            <select
              value={selectedIndex}
              onChange={e => setSelectedIndex(e.target.value)}
              style={{ background: '#ffffff', border: '1px solid ' + C.border, borderRadius: 8, padding: '8px 12px', fontSize: 14, fontFamily: 'Inter, sans-serif', color: C.text, minWidth: 240, cursor: 'pointer', outline: 'none' }}
            >
              <option value="">— Select an index —</option>
              {universe && Object.keys(universe.tree || {}).map(idx => {
                const n = (universe.tree[idx] || []).length;
                return <option key={idx} value={idx}>{idx} ({n})</option>;
              })}
            </select>
            <label style={{ fontSize: 12, color: C.textMut, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Company</label>
            <select
              value={selectedTicker}
              onChange={e => setSelectedTicker(e.target.value)}
              disabled={!selectedIndex || stocksList.length === 0}
              style={{ background: '#ffffff', border: '1px solid ' + C.border, borderRadius: 8, padding: '8px 12px', fontSize: 14, fontFamily: 'Inter, sans-serif', color: C.text, minWidth: 320, cursor: 'pointer', outline: 'none' }}
            >
              <option value="">— Select a company —</option>
              {stocksList.map(s => (
                <option key={s.ticker} value={s.ticker}>{s.name} ({s.ticker})</option>
              ))}
            </select>
            {stockMeta && (
              <span className="mono" style={{ fontSize: 11, color: C.textMut }}>{stockMeta.yahoo_symbol || selectedTicker} &bull; NSE</span>
            )}
            {/* Phase 6.5 — Weight in Index pulled from the enriched stocks-universe payload (ffmc-derived). */}
            {stockMeta && stockMeta.weight != null && stockMeta.weight > 0 && (
              <span className="mono" style={{ fontSize: 12, fontWeight: 700, padding: '4px 10px', borderRadius: 6, background: 'rgba(8,145,178,0.10)', border: '1px solid ' + C.cyan, color: C.cyan, marginLeft: 6 }}>
                Weight in {selectedIndex || 'Index'}: {stockMeta.weight.toFixed(2)}%
              </span>
            )}
          </div>

          {/* Phase 6.4 — Defensive rendering. No data fetch fires until a company is picked. */}
          {listLoading ? (
            <div style={{ padding: 40, textAlign: 'center', color: C.textMut, fontSize: 14 }}>Loading stocks universe…</div>
          ) : !universe ? (
            <div style={{ padding: 40, textAlign: 'center', color: C.textMut, fontSize: 14 }}>
              Stocks universe failed to load{fetchError ? ': ' + fetchError : '.'} Try Refresh, or switch to the Indices / Macro tab.
            </div>
          ) : !selectedTicker ? (
            <div style={{ padding: 40, textAlign: 'center', color: C.textMut, fontSize: 14 }}>
              Pick an index, then a company to load its max-history price chart.
            </div>
          ) : loading && (!data || data.length === 0) ? (
            <div style={{ padding: 40, textAlign: 'center', color: C.textMut, fontSize: 14 }}>Loading {selectedTicker}…</div>
          ) : !data || data.length === 0 ? (
            <div style={{ padding: 40, textAlign: 'center', color: C.textMut, fontSize: 14 }}>
              No data available for {selectedTicker}. Try Refresh — Yahoo may be rate-limited or this ticker may not be listed.
            </div>
          ) : (
          <React.Fragment>
          {/* KPI Cards */}
          <div className="kpi-grid" style={{ marginBottom: 32 }}>
            <StatCard label="Latest Price" value={latestClose != null ? latestClose.toFixed(2) : '—'} suffix="" color={C.cyan} subtext={'Mean: ' + stats.price.mean.toFixed(2) + (latestClose != null && stats.price.sd > 0 ? ' · Z ' + ((latestClose - stats.price.mean)/stats.price.sd >= 0 ? '+' : '−') + Math.abs((latestClose - stats.price.mean)/stats.price.sd).toFixed(2) + 'σ' : '')} />
            <StatCard label="P/E (TTM)" value={latestPE != null ? latestPE.toFixed(2) : '—'} suffix="x" color={C.blue} subtext={peRows.length > 0 ? ('Mean: ' + stats.pe.mean.toFixed(2) + 'x') : 'No fundamentals'} />
            <StatCard label="P/B" value={latestPB != null ? latestPB.toFixed(2) : '—'} suffix="x" color={C.purple} subtext={pbRows.length > 0 ? ('Mean: ' + stats.pb.mean.toFixed(2) + 'x') : 'No fundamentals'} />
            <StatCard label="Earnings Yield" value={latestEY != null ? latestEY.toFixed(2) : '—'} suffix="%" color={C.green} subtext="Inverse of P/E" />
            <StatCard label="Trading Days" value={data.length.toLocaleString()} suffix="" color={C.amber} subtext={firstAvailable ? ('Since ' + new Date(firstAvailable).toLocaleDateString('en-IN', {month:'short', year:'numeric'})) : ''} />
          </div>

          {/* Phase 7.3 — Fundamental Snapshot. Live Yahoo quoteSummary fields (Trailing EPS, P/B, ROE,
              EPS Growth, Trailing/Forward PE, Market Cap) styled to match the KPI tiles used across
              the Indices tabs. Defensive: any null field renders as "N/A" rather than crashing. */}
          {(() => {
            const q = quoteCache[selectedTicker];
            const f = q?.fundamentals;
            const na = (v, fmt) => (v == null || !isFinite(v)) ? 'N/A' : (typeof fmt === 'function' ? fmt(v) : String(v));
            const fmtX  = v => v.toFixed(2) + 'x';
            const fmtPc = v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
            const fmtN  = v => v.toFixed(2);
            const fmtMC = v => v >= 1e12 ? '₹' + (v/1e12).toFixed(2) + 'T' : v >= 1e9 ? '₹' + (v/1e9).toFixed(2) + 'B' : v >= 1e7 ? '₹' + (v/1e7).toFixed(2) + 'Cr' : '₹' + v.toFixed(0);
            return (
              <div style={{ marginBottom: 24 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10, flexWrap: 'wrap', gap: 8 }}>
                  <div>
                    <div style={{ fontSize: 13, color: C.text, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Fundamental Snapshot</div>
                    <div style={{ fontSize: 11, color: C.textMut, marginTop: 2, fontStyle: 'italic' }}>
                      {quoteLoading && !f ? 'Loading live fundamentals from Yahoo Finance…' : (q?.error ? ('Yahoo: ' + q.error + ' — fields show N/A') : 'Live Yahoo Finance quoteSummary · auto-refresh on ticker change')}
                    </div>
                  </div>
                  {f && (
                    <span className="mono" style={{ fontSize: 11, color: C.textMut }}>as of {q?.asOf || 'today'}</span>
                  )}
                </div>
                <div className="kpi-grid">
                  <StatCard label="Trailing EPS" value={na(f?.trailingEps, fmtN)} suffix={f?.currency ? ' ' + f.currency : ''} color={C.cyan} subtext="TTM diluted EPS · Yahoo" />
                  <StatCard label="P/B (Live)" value={na(f?.priceToBook, fmtX)} suffix="" color={C.purple} subtext={f?.bookValue != null ? ('Book Value: ' + f.bookValue.toFixed(2)) : 'Price ÷ Book Value/Share'} />
                  <StatCard label="ROE" value={na(f?.returnOnEquity, fmtPc)} suffix="" color={(f?.returnOnEquity != null && f.returnOnEquity >= 15) ? C.green : C.amber} subtext={(f?.returnOnEquity != null && f.returnOnEquity >= 15) ? 'Quality threshold ≥15%' : 'Below quality threshold'} />
                  <StatCard label="EPS Growth (Fwd)" value={na(f?.epsGrowthPct, fmtPc)} suffix="" color={(f?.epsGrowthPct != null && f.epsGrowthPct >= 0) ? C.green : C.red} subtext={f?.epsForward != null ? ('Forward EPS: ' + f.epsForward.toFixed(2)) : 'Forward / Trailing − 1'} />
                  <StatCard label="P/E (Live)" value={na(f?.trailingPE, fmtX)} suffix="" color={C.blue} subtext={f?.forwardPE != null ? ('Fwd: ' + f.forwardPE.toFixed(2) + 'x') : 'Trailing 12-month'} />
                  <StatCard label="Market Cap" value={na(f?.marketCap, fmtMC)} suffix="" color={C.amber} subtext={f?.dividendYieldPct != null ? ('Div Yield: ' + f.dividendYieldPct.toFixed(2) + '%') : 'Live market cap'} />
                </div>
              </div>
            );
          })()}

          {/* Price Chart */}
          <div style={{ marginBottom: 24 }}>
            <ChartCard
              title="Price (INR) — Historical Close"
              subtitle="Daily close price from Yahoo Finance"
              badge={latestClose != null ? latestClose.toFixed(2) : null}
              badgeColor={C.cyan}
              badgeBg={'rgba(8,145,178,0.15)'}
            >
              <ResponsiveContainer width="100%" height={380}>
                <ComposedChart key={'stock-price-'+selectedTicker+'-'+period} data={priceChart} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
                  <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={priceTickInterval} stroke={C.grid} />
                  <YAxis domain={priceDomain} ticks={priceTicks} tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => v.toFixed(2)} />
                  <Tooltip content={<Tip fields={[
                    { key: 'close', label: 'Close', color: C.cyan },
                    { key: 'priceMean', label: 'Mean', color: C.purple },
                  ]} />} />
                  <ReferenceLine y={stats.price.sd2Upper} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+2σ (' + fmt2(stats.price.sd2Upper) + ')', position: 'insideTopRight', fill: C.red, fontSize: 10 }} />
                  <ReferenceLine y={stats.price.sd1Upper} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '+1σ (' + fmt2(stats.price.sd1Upper) + ')', position: 'insideTopRight', fill: C.amber, fontSize: 10 }} />
                  <ReferenceLine y={stats.price.mean} stroke={C.purple} strokeWidth={1.5} strokeDasharray="6 4" label={{ value: 'Mean (' + fmt2(stats.price.mean) + ')', position: 'insideTopRight', fill: C.purple, fontSize: 10 }} />
                  <ReferenceLine y={stats.price.sd1Lower} stroke={C.amber} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−1σ (' + fmt2(stats.price.sd1Lower) + ')', position: 'insideBottomRight', fill: C.amber, fontSize: 10 }} />
                  <ReferenceLine y={stats.price.sd2Lower} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: '−2σ (' + fmt2(stats.price.sd2Lower) + ')', position: 'insideBottomRight', fill: C.red, fontSize: 10 }} />
                  <Line type="monotone" dataKey="close" stroke={C.cyan} strokeWidth={2} dot={false} isAnimationActive={false} />
                </ComposedChart>
              </ResponsiveContainer>
              <ZoneLegend stats={stats.price} suffix="" />
            </ChartCard>
          </div>

          {/* Phase 10.1 — Tusk Quality & Governance Guard
              Forensic / capital-allocation companion panel rendered alongside the Price chart.
              Reads stocks-quote.forensics: promoter pledge %, auditor cleanliness, Beneish M-score,
              CFO/EBITDA, and a 5-year ROE-WACC spread sparkline. Color-coded by flag (red/amber/green).
              All inline charts respect the global period selector via slicedSpread() below. */}
          {(() => {
            const q = quoteCache[selectedTicker];
            const fo = q?.forensics;
            if (!fo) return null;
            const flagColors = { red: C.red, amber: C.amber, green: C.green };
            const flagLabel  = { red: 'RED FLAG', amber: 'CAUTION', green: 'CLEAN' };
            const fpct = (v) => v == null ? 'N/A' : (+v).toFixed(2) + '%';
            const fnum = (v) => v == null ? 'N/A' : (+v).toFixed(2);
            // Slice 5y ROE-WACC monthly series by global period toggle (1Y/3Y/5Y/10Y → trailing months).
            const slicedSpread = (() => {
              const series = fo.roeWaccSeries?.series || [];
              const yrs = { '1Y': 1, '3Y': 3, '5Y': 5, '10Y': 10 }[period];
              if (!yrs || series.length === 0) return series;
              return series.slice(-Math.min(series.length, yrs));
            })();

    // Phase 8.1 — Global Control Panel: regime engine + allocation matrix.
    // Macro regime taxonomy is the standard 4-state mid-cycle framework used by India strategists.
    // ALLOCATION_MATRIX defines stylized sector weights (% of equity sleeve) for each regime —
    // values are research-anchored to broker model portfolios (Morgan Stanley, Jefferies India strategy).
    const REGIME_OPTIONS = [
      { id: 'auto',           label: 'Auto (Regime Engine)' },
      { id: 'expansion',      label: 'Expansion' },
      { id: 'moderation',     label: 'Moderation' },
      { id: 'slowdown',       label: 'Slowdown' },
      { id: 'stagflationary', label: 'Stagflationary' },
    ];
    const REGIME_DESCRIPTIONS = {
      expansion:      'Growth accelerating, inflation contained. Cyclicals + small/midcaps + Financials lead. Bond duration shortened.',
      moderation:     'Growth steady, inflation in tolerance band. Balanced — quality compounders + secular growers carry the cycle.',
      slowdown:       'Growth decelerating, inflation easing. Defensives, IT, Pharma, FMCG outperform. Bond duration extended.',
      stagflationary: 'Growth weak, inflation elevated. Real assets (Metals, Energy), Pharma, gold, USD beat equities.',
    };
    const ALLOCATION_MATRIX = {
      expansion:      { Financials: 22, IT: 12, Energy: 8,  Auto: 14, FMCG: 6,  Pharma: 6,  Metals: 12, Infra: 12, Realty: 6, 'Cash/Bonds': 2 },
      moderation:     { Financials: 22, IT: 18, Energy: 8,  Auto: 10, FMCG: 10, Pharma: 8,  Metals: 6,  Infra: 8,  Realty: 4, 'Cash/Bonds': 6 },
      slowdown:       { Financials: 12, IT: 22, Energy: 8,  Auto: 6,  FMCG: 18, Pharma: 14, Metals: 4,  Infra: 4,  Realty: 2, 'Cash/Bonds': 10 },
      stagflationary: { Financials: 8,  IT: 10, Energy: 22, Auto: 4,  FMCG: 14, Pharma: 12, Metals: 14, Infra: 8,  Realty: 4, 'Cash/Bonds': 4 },
    };
    const REGIME_COLOR = { expansion: '#10b981', moderation: '#2563eb', slowdown: '#d97706', stagflationary: '#dc2626' };

    // Phase 8.1 — Auto regime classifier. Reads the india-extras feed for live CPI YoY (headline
    // inflation) and Industry IIP YoY (high-frequency growth proxy), then applies the canonical
    // 2x2 inflation-vs-growth grid. Returns null if either signal is missing.
    function computeAutoRegime(indiaExtras) {
      const cpiSeries = indiaExtras?.cpi?.series || [];
      const indSeries = indiaExtras?.gva?.industry?.series || [];
      const cpiLatest = cpiSeries.length ? cpiSeries[cpiSeries.length - 1].value : null;
      const indLatest = indSeries.length ? indSeries[indSeries.length - 1].value : null;
      if (cpiLatest == null || indLatest == null) return null;
      const highInflation   = cpiLatest >= 5;   // RBI upper tolerance
      const strongGrowth    = indLatest >= 6;
      const moderateGrowth  = indLatest >= 3;
      if (highInflation && !moderateGrowth) return { id: 'stagflationary', cpi: cpiLatest, growth: indLatest };
      if (strongGrowth   && !highInflation)   return { id: 'expansion',      cpi: cpiLatest, growth: indLatest };
      if (moderateGrowth)                     return { id: 'moderation',     cpi: cpiLatest, growth: indLatest };
      return { id: 'slowdown', cpi: cpiLatest, growth: indLatest };
    }

    // Phase 8.1 — Allocation Strategy Matrix. Renders the active regime's sector weights as a
    // horizontal bar grid, with the regime color anchoring the heatmap. Re-renders the moment
    // `effectiveRegime` flips (either via the Auto engine or a manual override from ControlPanel).
    function AllocationMatrix({ regimeId, isOverride, autoRegime }) {
      if (!regimeId || !ALLOCATION_MATRIX[regimeId]) return null;
      const weights = ALLOCATION_MATRIX[regimeId];
      const entries = Object.entries(weights);
      const accent = REGIME_COLOR[regimeId] || C.purple;
      const label = (REGIME_OPTIONS.find(r => r.id === regimeId) || {}).label || regimeId;
      return (
        <div style={{ background: C.card, border: '2px solid ' + (isOverride ? C.amber : C.border), borderRadius: 12, padding: 20, marginBottom: 24 }}>

              </div>
            </div>
            <span className="mono" style={{ fontSize: 11, color: C.textMut }}>% of equity sleeve · sums to 100</span>
          </div>
          <div style={{ fontSize: 12, color: C.textSec, marginBottom: 14, lineHeight: 1.55 }}>{REGIME_DESCRIPTIONS[regimeId]}</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 10 }}>
            {entries.map(([sector, weight]) => (
              <div key={sector} style={{ background: 'rgba(148,163,184,0.06)', borderLeft: '3px solid ' + accent, borderRadius: '0 6px 6px 0', padding: '10px 12px' }}>

                <div style={{ marginTop: 6, height: 4, background: 'rgba(148,163,184,0.18)', borderRadius: 2, overflow: 'hidden' }}>
                  <div style={{ height: '100%', width: Math.min(100, weight * 4) + '%', background: accent }} />
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Dashboard() {

      // Phase 8.1 — Regime override. 'auto' = use computeAutoRegime(indiaExtras); otherwise force.
      const [regimeOverride, setRegimeOverride] = useState('auto');
      // Phase 5.4 — native Refresh Data button state: 'idle' | 'refreshing' | 'done' | 'error'
      const [refreshState, setRefreshState] = useState('idle');
      const triggerRefresh = useCallback(() => {
        if (refreshState === 'refreshing') return;
        setRefreshState('refreshing');
        // Fire-and-don't-wait against the Edge Function; server-side update-all takes 1–3 min.
        // We optimistically flip to 'done' after ~3s (the request was accepted server-side) so the
        // UI feels responsive. The auto-refresh countdown below will re-pull fresh data shortly after.
        const ctl = new AbortController();
        const timeoutId = setTimeout(() => ctl.abort(), 4000);
        fetch(STOCKS_BASE + '?mode=update-all&t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' })
          .then(() => { clearTimeout(timeoutId); setRefreshState('done'); setTimeout(() => setRefreshState('idle'), 2200); })
          .catch(() => { clearTimeout(timeoutId); /* AbortError after 4s = success path (server still processing) */
            setRefreshState('done'); setTimeout(() => setRefreshState('idle'), 2200); });
        // Also restart the per-tab countdown so we re-pull data shortly.
        setCountdown(15);
      }, [refreshState]);
      // Phase-2: Sector Deep Dives parent tab. Hook MUST live with the other useState calls,
      // BEFORE the `if (loading && data.length === 0) return (...)` guard further down,

        };

      const customStartISO = useMemo(() => parseDMY(customStart), [customStart]);

      const indexConfig = AVAILABLE_INDICES.find(x => x.id === activeIndex) || AVAILABLE_INDICES[0];
      const taaConfig = TAA_INDEX_CONFIGS[activeIndex] || null;

      const fetchData = useCallback(async (idx) => {
        const indexToFetch = idx || activeIndex;
        // Phase-5: macro-hub pseudo-indices have no time-series in daily_eyby_data — skip.
        if (indexToFetch === 'india-macro-hub' || indexToFetch === 'global-macro-hub') { setLoading(false); return; }
        setLoading(true);
        try {
          const resp = await fetch(BASE_URL + '&index=' + indexToFetch + '&t=' + Date.now(), { cache: 'no-store' });
          const raw = await resp.json();
          if (Array.isArray(raw) && raw.length > 0) {
            let processed;
            // Detect format: compact arrays (Indian) vs enriched objects (US)
            if (Array.isArray(raw[0])) {
              // Indian format: compact arrays [date, pe, pb, bondYield, close]
              processed = processRaw(raw);
            } else if (typeof raw[0] === 'object') {
              // US format: enriched objects — normalize field names for Dashboard compatibility
              processed = raw.map(d => ({
                ...d,
                bondYield: d.bondYield != null ? d.bondYield : d.gsec10,
                earningsYield: d.earningsYield != null ? d.earningsYield : (d.pe > 0 ? +((1/d.pe)*100).toFixed(2) : null),
              }));
            } else {
              processed = raw;
            }
            setDataCache(prev => ({ ...prev, [indexToFetch]: processed }));
            if (indexToFetch === activeIndex) {
              const lastDate = (typeof raw[raw.length - 1] === 'object' && raw[raw.length - 1].date)
                ? raw[raw.length - 1].date
                : (Array.isArray(raw[raw.length - 1]) ? raw[raw.length - 1][0] : '');
              setLastUpdated(lastDate);
            }
          }
        } catch (e) { console.error('Data fetch error:', e); }
        setLoading(false);
      }, [activeIndex]);

      useEffect(() => { fetchData(activeIndex); }, [activeIndex]);

      // Pre-fetch Nifty 50 data for ratio charts when viewing Capital Markets
      useEffect(() => {
        if (isSectorIndex(activeIndex)) {
          fetch(BASE_URL + '&index=nifty50&t=' + Date.now(), { cache: 'no-store' })
            .then(r => r.json())
            .then(raw => {
              if (Array.isArray(raw) && raw.length > 0) {
                let processed;
                // Detect format: compact arrays (Indian) vs enriched objects (US)
                if (Array.isArray(raw[0])) {
                  // Indian format: compact arrays [date, pe, pb, bondYield, close]
                  processed = processRaw(raw);
                } else if (typeof raw[0] === 'object') {
                  // US format: normalize field names
                  processed = raw.map(d => ({
                    ...d,
                    bondYield: d.bondYield != null ? d.bondYield : d.gsec10,
                    earningsYield: d.earningsYield != null ? d.earningsYield : (d.pe > 0 ? +((1/d.pe)*100).toFixed(2) : null),
                  }));
                } else {
                  processed = raw;
                }
                setDataCache(prev => prev.nifty50 ? prev : { ...prev, nifty50: processed });
              }
            }).catch(() => {});
        }
      }, [activeIndex]);

      useEffect(() => {
        const t = setInterval(() => {
          setCountdown(prev => {
            if (prev <= 1) { fetchData(activeIndex); return 300; }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(t);
      }, [activeIndex]);

      const data = dataCache[activeIndex] || [];
      const [topChartMode, setTopChartMode] = useState('eyby');

      const filtered = useMemo(() => {
        if (data.length === 0) return [];
        return applyPeriodFilter(data, period, customStartISO);
      }, [data, period, customStartISO]);

      // Phase 5.6B Hotfix — Capital Markets uses NSE CSV snapshots which don't ship the 10Y G-Sec yield
      // alongside PE/PB. To prevent stale or null bond-yield flicker, inherit Nifty 50's most-recent
      // bondYield as the authoritative India 10Y G-Sec. Applies to any Indian index whose own latest
      // bondYield is missing.
      const _rawCurrent = filtered.length > 0 ? filtered[filtered.length - 1] : { date:'', pe:0, pb:0, bondYield:0, earningsYield:0, eyby:0 };
      const _nifty50Cache = dataCache['nifty50'] || [];
      const _nifty50LatestBy = (_nifty50Cache.length > 0 ? (
        Array.isArray(_nifty50Cache[_nifty50Cache.length - 1])
          ? _nifty50Cache[_nifty50Cache.length - 1][3]
          : (_nifty50Cache[_nifty50Cache.length - 1].bondYield ?? _nifty50Cache[_nifty50Cache.length - 1].by_yield)
      ) : null);
      const current = (activeCountry === 'india' && (_rawCurrent.bondYield == null || _rawCurrent.bondYield === 0) && _nifty50LatestBy != null)
        ? { ..._rawCurrent, bondYield: _nifty50LatestBy }
        : _rawCurrent;

      // ERP chart data (Forward EY - G-Sec) and FII proxy for side-by-side with RSI
      // Skip enrichment if data is already in enriched format (US indices)
      const enrichedData = useMemo(() => (taaConfig && data.length > 30) ? (needsEnrichment(data) ? enrichTaaInputs(data) : data) : [], [data, taaConfig]);
      const enrichedFiltered = useMemo(() => enrichedData.length > 0 ? applyPeriodFilter(enrichedData, period, customStartISO) : [], [enrichedData, period, customStartISO]);
      const erpChartData = useMemo(() => {
        if (enrichedFiltered.length === 0) return [];
        const step = Math.max(1, Math.floor(enrichedFiltered.length / 300));
        const s = enrichedFiltered.filter((_,i) => i % step === 0);
        if (s.length > 0 && s[s.length-1] !== enrichedFiltered[enrichedFiltered.length-1]) s.push(enrichedFiltered[enrichedFiltered.length-1]);
        return s.map(d => ({ date: d.date, erp: d.erp, fii: d.fii_fut_net_long }));
      }, [enrichedFiltered]);
      const erpStats = useMemo(() => {
        const vals = erpChartData.filter(d => d.erp != null).map(d => d.erp);
        return vals.length > 5 ? calcStats(vals) : EMPTY_STATS;
      }, [erpChartData]);
      const erpDomain = useMemo(() => {
        const vals = erpChartData.map(d => d.erp).filter(v => v != null);
        if (vals.length === 0) return [-2, 4];
        return [+Math.min(...vals).toFixed(2), +Math.max(...vals).toFixed(2)];
      }, [erpChartData]);
      const erpTicks = useMemo(() => niceTicks(erpDomain[0], erpDomain[1], 5, 2), [erpDomain]);
      const fiiStats = useMemo(() => {
        const vals = erpChartData.filter(d => d.fii != null).map(d => d.fii);
        return vals.length > 5 ? calcStats(vals) : EMPTY_STATS;
      }, [erpChartData]);
      const fiiDomain = useMemo(() => {
        const vals = erpChartData.map(d => d.fii).filter(v => v != null);
        if (vals.length === 0) return [0, 100];
        return [+Math.min(...vals).toFixed(1), +Math.max(...vals).toFixed(1)];
      }, [erpChartData]);
      const fiiTicks = useMemo(() => niceTicks(fiiDomain[0], fiiDomain[1], 5, 1), [fiiDomain]);

      // Breadth & MCap/GDP chart data (derived from enrichedFiltered, date-filtered)
      const breadthMcapChartData = useMemo(() => {
        if (enrichedFiltered.length === 0) return [];
        const step = Math.max(1, Math.floor(enrichedFiltered.length / 300));
        const s = enrichedFiltered.filter((_,i) => i % step === 0);
        if (s.length > 0 && s[s.length-1] !== enrichedFiltered[enrichedFiltered.length-1]) s.push(enrichedFiltered[enrichedFiltered.length-1]);
        return s.map(d => ({ date: d.date, breadth: d.breadth, mcap: d.mcap_gdp }));
      }, [enrichedFiltered]);
      const breadthStats = useMemo(() => {
        const vals = breadthMcapChartData.filter(d => d.breadth != null).map(d => d.breadth);
        return vals.length > 5 ? calcStats(vals) : EMPTY_STATS;
      }, [breadthMcapChartData]);
      const breadthDomain = useMemo(() => {
        const vals = breadthMcapChartData.map(d => d.breadth).filter(v => v != null);
        if (vals.length === 0) return [0, 100];
        const mn = Math.min(...vals), mx = Math.max(...vals);
        const pad = (mx - mn) * 0.05 || 5;
        return [+(mn - pad).toFixed(1), +(mx + pad).toFixed(1)];
      }, [breadthMcapChartData]);
      const breadthTicks = useMemo(() => niceTicks(breadthDomain[0], breadthDomain[1], 5, 1), [breadthDomain]);
      const mcapStats = useMemo(() => {
        const vals = breadthMcapChartData.filter(d => d.mcap != null).map(d => d.mcap);
        return vals.length > 5 ? calcStats(vals) : EMPTY_STATS;
      }, [breadthMcapChartData]);
      const mcapDomain = useMemo(() => {
        const vals = breadthMcapChartData.map(d => d.mcap).filter(v => v != null);
        if (vals.length === 0) return [0, 200];
        const mn = Math.min(...vals), mx = Math.max(...vals);
        const pad = (mx - mn) * 0.05 || 5;
        return [+(mn - pad).toFixed(1), +(mx + pad).toFixed(1)];
      }, [breadthMcapChartData]);
      const mcapTicks = useMemo(() => niceTicks(mcapDomain[0], mcapDomain[1], 5, 0), [mcapDomain]);
      const bmTickInterval = Math.max(1, Math.floor(breadthMcapChartData.length / 8));

      // EMPTY_STATS is defined at module scope (line 175) — do NOT redeclare here
      // because Babel converts const→var, causing var-hoisting shadow bugs.
      const filteredStats = useMemo(() => {
        if (filtered.length === 0) return { pe: EMPTY_STATS, pb: EMPTY_STATS, eyby: EMPTY_STATS, by: EMPTY_STATS, close: EMPTY_STATS };
        const peVals = filtered.map(x => x.pe).filter(v => v != null && isFinite(v));
        const pbVals = filtered.map(x => x.pb).filter(v => v != null && isFinite(v));
        const eybyVals = filtered.map(x => x.eyby).filter(v => v != null && isFinite(v));
        const byVals = filtered.map(x => x.bondYield).filter(v => v != null && isFinite(v));
        const closeVals = filtered.map(x => x.close).filter(v => v != null && isFinite(v));
        return {
          pe: peVals.length > 1 ? calcStats(peVals) : EMPTY_STATS,
          pb: pbVals.length > 1 ? calcStats(pbVals) : EMPTY_STATS,
          eyby: eybyVals.length > 1 ? calcStats(eybyVals) : EMPTY_STATS,
          by: byVals.length > 1 ? calcStats(byVals) : EMPTY_STATS,
          close: closeVals.length > 1 ? calcStats(closeVals) : EMPTY_STATS,
        };
      }, [filtered]);

      const sampled = useMemo(() => {
        if (filtered.length === 0) return [];
        const step = Math.max(1, Math.floor(filtered.length / 300));
        const s = filtered.filter((_, i) => i % step === 0);
        if (s.length > 0 && s[s.length - 1] !== filtered[filtered.length - 1]) s.push(filtered[filtered.length - 1]);
        return s;
      }, [filtered]);

      const chartData = useMemo(() => sampled.map(d => ({
        ...d, peMean: (filteredStats?.pe || EMPTY_STATS).mean, pbMean: (filteredStats?.pb || EMPTY_STATS).mean, eybyMean: (filteredStats?.eyby || EMPTY_STATS).mean,
      })), [sampled, filteredStats]);

      const eybyDomain = useMemo(() => {
        const vals = chartData.map(d => d.eyby).filter(v => v != null);
        if (vals.length === 0) return [0, 1];
        const mn = Math.min(...vals); const mx = Math.max(...vals);
        return [+mn.toFixed(2), +mx.toFixed(2)];
      }, [chartData]);
      const eybyTicks = useMemo(() => niceTicks(eybyDomain[0], eybyDomain[1], 5, 2), [eybyDomain]);

      const peDomain = useMemo(() => {
        const vals = chartData.map(d => d.pe).filter(v => v != null);
        if (vals.length === 0) return [0, 1];
        const mn = Math.min(...vals); const mx = Math.max(...vals);
        return [+mn.toFixed(2), +mx.toFixed(2)];
      }, [chartData]);
      const peTicks = useMemo(() => niceTicks(peDomain[0], peDomain[1], 5, 2), [peDomain]);

      const pbDomain = useMemo(() => {
        const vals = chartData.map(d => d.pb).filter(v => v != null);
        if (vals.length === 0) return [0, 1];
        const mn = Math.min(...vals); const mx = Math.max(...vals);
        return [+mn.toFixed(2), +mx.toFixed(2)];
      }, [chartData]);
      const pbTicks = useMemo(() => niceTicks(pbDomain[0], pbDomain[1], 5, 2), [pbDomain]);

      const tickInterval = Math.max(1, Math.floor(chartData.length / 8));

      // === ROE vs P/B dual-axis chart data ===
      const roePbChartData = useMemo(() => {
        return chartData.map(d => {
          const roe = (d.pe != null && d.pe > 0 && d.pb != null) ? +((d.pb / d.pe) * 100).toFixed(2) : null;
          return { date: d.date, pb: d.pb, roe };
        });
      }, [chartData]);
      const currentROE = useMemo(() => {
        if (roePbChartData.length === 0) return null;
        return roePbChartData[roePbChartData.length - 1].roe;
      }, [roePbChartData]);
      const roeDomain = useMemo(() => {
        const vals = roePbChartData.map(d => d.roe).filter(v => v != null && isFinite(v));
        if (vals.length === 0) return [0, 30];
        const mn = Math.min(...vals); const mx = Math.max(...vals);
        const pad = (mx - mn) * 0.05 || 1;
        return [+(mn - pad).toFixed(1), +(mx + pad).toFixed(1)];
      }, [roePbChartData]);
      const roeTicks = useMemo(() => niceTicks(roeDomain[0], roeDomain[1], 5, 1), [roeDomain]);
      const roePbDomain = useMemo(() => {
        const vals = roePbChartData.map(d => d.pb).filter(v => v != null && isFinite(v));
        if (vals.length === 0) return [0, 5];
        const mn = Math.min(...vals); const mx = Math.max(...vals);
        const pad = (mx - mn) * 0.05 || 0.2;
        return [+(mn - pad).toFixed(2), +(mx + pad).toFixed(2)];
      }, [roePbChartData]);
      const roePbTicks = useMemo(() => niceTicks(roePbDomain[0], roePbDomain[1], 5, 2), [roePbDomain]);

      // === Relative Valuation Ratios: Capital Markets / Nifty 50 ===
      const n50Data = dataCache['nifty50'] || [];
      const ratioAll = useMemo(() => {
        if (!isSectorIndex(activeIndex) || n50Data.length === 0 || data.length === 0) return [];
        const n50Map = {};
        n50Data.forEach(d => { n50Map[d.date] = d; });
        return data
          .filter(d => n50Map[d.date] && d.pe > 0 && d.pb > 0 && n50Map[d.date].pe > 0 && n50Map[d.date].pb > 0)
          .map(d => ({ date: d.date, peRatio: +(d.pe / n50Map[d.date].pe).toFixed(4), pbRatio: +(d.pb / n50Map[d.date].pb).toFixed(4) }));
      }, [activeIndex, data, n50Data]);

      const filteredRatio = useMemo(() => {
        if (ratioAll.length === 0) return [];
        return applyPeriodFilter(ratioAll, period, customStartISO);
      }, [ratioAll, period, customStartISO]);

      const ratioSampled = useMemo(() => {
        if (filteredRatio.length === 0) return [];
        const step = Math.max(1, Math.floor(filteredRatio.length / 300));
        const s = filteredRatio.filter((_, i) => i % step === 0);
        if (s.length > 0 && s[s.length - 1] !== filteredRatio[filteredRatio.length - 1]) s.push(filteredRatio[filteredRatio.length - 1]);
        return s;
      }, [filteredRatio]);

      const ratioStats = useMemo(() => {
        const _e = EMPTY_STATS;
        if (filteredRatio.length === 0) return { pe: {...EMPTY_STATS}, pb: {...EMPTY_STATS} };
        return { pe: calcStats(filteredRatio.map(x => x.peRatio)), pb: calcStats(filteredRatio.map(x => x.pbRatio)) };
      }, [filteredRatio]);

      const ratioChartData = useMemo(() => ratioSampled.map(d => ({
        ...d, peRatioMean: (ratioStats?.pe || EMPTY_STATS).mean, pbRatioMean: (ratioStats?.pb || EMPTY_STATS).mean,
      })), [ratioSampled, ratioStats]);

      const peRatioDomain = useMemo(() => {
        const vals = ratioChartData.map(d => d.peRatio).filter(v => v != null);
        if (vals.length === 0) return [0, 1];
        const mn = Math.min(...vals); const mx = Math.max(...vals);
        return [+mn.toFixed(2), +mx.toFixed(2)];
      }, [ratioChartData]);
      const peRatioTicks = useMemo(() => niceTicks(peRatioDomain[0], peRatioDomain[1], 5, 2), [peRatioDomain]);

      const pbRatioDomain = useMemo(() => {
        const vals = ratioChartData.map(d => d.pbRatio).filter(v => v != null);
        if (vals.length === 0) return [0, 1];
        const mn = Math.min(...vals); const mx = Math.max(...vals);
        return [+mn.toFixed(2), +mx.toFixed(2)];
      }, [ratioChartData]);
      const pbRatioTicks = useMemo(() => niceTicks(pbRatioDomain[0], pbRatioDomain[1], 5, 2), [pbRatioDomain]);

      const ratioTickInterval = Math.max(1, Math.floor(ratioChartData.length / 8));

      // Phase-5: skip the loading guard for the macro-hub pseudo-tabs (they don't pull from daily_eyby_data).
      const isMacroHubTab = (activeCountry === 'india-macro' || activeCountry === 'global-macro');
      if (loading && data.length === 0 && !isMacroHubTab) {
        return (
          <div style={{ padding: 24, maxWidth: 1400, margin: '0 auto', textAlign: 'center', paddingTop: 120 }}>
            <div style={{ fontSize: 18, color: C.textMut }}>Loading dashboard data...</div>
          </div>
        );
      }

      const handleCountrySwitch = (country) => {
        setActiveCountry(country);
        const firstIdx = COUNTRY_INDICES[country][0].id;
        handleIndexSwitch(firstIdx);
      };
      // Phase-4: handleIndexSwitch is now flat — no parent-tab dropdowns to track.
      const handleIndexSwitch = (idx) => {
        setActiveIndex(idx);
        setCountdown(300);
        if (!dataCache[idx] && idx !== 'global-macro-hub') {
          setLoading(true);
        } else if (dataCache[idx]) {
          const cached = dataCache[idx];
          if (cached.length > 0) setLastUpdated(cached[cached.length - 1].date);
        }
      };

      // Phase-4 Global Macro Hub & Phase-5 India Macro Hub — convenience flags.
      const inGlobalMacroHub = (activeCountry === 'global-macro');
      const inIndiaMacroHub  = (activeCountry === 'india-macro');

      const dataStartLabel = (activeIndex === 'nifty50') ? 'Apr 2016' : (activeIndex === 'sp500' || activeIndex === 'nasdaq') ? 'Data pending' : 'Oct 2024';

      return (
        <React.Fragment>
          {/* Section Tabs (Indices / Stocks) */}
          <div style={{ maxWidth: 1400, margin: '0 auto', padding: '16px 24px 0' }}>
            <div style={{ display: 'flex', gap: 4, borderBottom: '1px solid ' + C.border }}>
              <button onClick={() => setSection('indices')}
                style={{ background: 'transparent', border: 'none', borderBottom: '2px solid ' + (section === 'indices' ? C.cyan : 'transparent'), color: section === 'indices' ? C.cyan : C.textMut, padding: '12px 24px', fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: 'Inter, sans-serif', letterSpacing: '0.02em', textTransform: 'uppercase', marginBottom: -1 }}>
                Indices
              </button>
              <button onClick={() => setSection('stocks')}
                style={{ background: 'transparent', border: 'none', borderBottom: '2px solid ' + (section === 'stocks' ? C.cyan : 'transparent'), color: section === 'stocks' ? C.cyan : C.textMut, padding: '12px 24px', fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: 'Inter, sans-serif', letterSpacing: '0.02em', textTransform: 'uppercase', marginBottom: -1 }}>
                Stocks
              </button>
            </div>
          </div>
          {section === 'stocks' ? (
            <StocksDashboard period={period} setPeriod={setPeriod} customStart={customStart} setCustomStart={setCustomStart} customStartISO={customStartISO} />
          ) : (
        <div style={{ padding: 24, maxWidth: 1400, margin: '0 auto' }}>
          {/* Header */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 24, flexWrap: 'wrap', gap: 16 }}>
            <div>
              <h1 style={{ fontSize: 28, fontWeight: 700, color: C.text, letterSpacing: '-0.02em', display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                Equity Macro Dashboard
                {/* Phase 6.5 — Z-Score badge: live regime gauge for the visible time horizon. */}
                {current && current.close != null && filteredStats?.close && (
                  <ZScoreBadge latest={current.close} mean={filteredStats.close.mean} sd={filteredStats.close.sd} suffix="" />
                )}
              </h1>
              <p style={{ fontSize: 14, color: C.textMut, marginTop: 6 }}>{indexConfig.label} Valuation Metrics &bull; Data till: {lastUpdated ? new Date(lastUpdated).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '...'}</p>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
              {/* Phase 8.1 — Global Control Panel. Wraps the time-period segmented control + regime
                  selector. Amber border lights up when a manual regime override is active. */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 8px', border: '1.5px solid ' + (regimeOverride !== 'auto' ? C.amber : C.border), borderRadius: 8, background: regimeOverride !== 'auto' ? 'rgba(217,119,6,0.04)' : 'transparent', transition: 'border-color 0.18s ease, background 0.18s ease' }}>
                <span style={{ fontSize: 10, color: regimeOverride !== 'auto' ? C.amber : C.textMut, textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 700 }}>{regimeOverride !== 'auto' ? 'Override' : 'Time'}</span>
                <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                  {PERIODS.filter(p => p.label !== 'Date').map(p => (
                    <button key={p.label} onClick={() => { setPeriod(p.label); setCustomStart(''); }}
                      style={{ background: period === p.label ? C.cyan : 'transparent', border: '1px solid ' + (period === p.label ? C.cyan : C.border), color: period === p.label ? '#ffffff' : C.textSec, borderRadius: 6, padding: '4px 10px', fontSize: 11, fontWeight: period === p.label ? 600 : 400, cursor: 'pointer', fontFamily: 'Inter, sans-serif' }}>
                      {p.label === 'All' ? 'MAX' : p.label}
                    </button>
                  ))}
                  <input
                    type="date"
                    value={customStartISO || ''}
                    onChange={e => {
                      const v = e.target.value;
                      if (v) {
                        const [y, m, d] = v.split('-');
                        setCustomStart(d + '-' + m + '-' + y);
                        setPeriod('Date');
                      } else {
                        setCustomStart('');
                        setPeriod('All');
                      }
                    }}
                    title="Pick a custom start date"
                    style={{ marginLeft: 2, background: period === 'Date' ? C.cyan : 'transparent', border: '1px solid ' + (period === 'Date' ? C.cyan : C.border), color: period === 'Date' ? '#ffffff' : C.textSec, borderRadius: 6, padding: '3px 8px', fontSize: 11, fontFamily: 'Inter, sans-serif', outline: 'none', cursor: 'pointer' }}
                  />
                </div>
                <span style={{ fontSize: 10, color: regimeOverride !== 'auto' ? C.amber : C.textMut, textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 700, marginLeft: 4 }}>Regime</span>
                <select
                  value={regimeOverride}
                  onChange={e => setRegimeOverride(e.target.value)}
                  title={regimeOverride === 'auto' ? 'Auto-detected from live CPI + IIP YoY' : 'Manual what-if override active'}
                  style={{ background: regimeOverride !== 'auto' ? 'rgba(217,119,6,0.12)' : '#ffffff', border: '1px solid ' + (regimeOverride !== 'auto' ? C.amber : C.border), color: regimeOverride !== 'auto' ? C.amber : C.textSec, borderRadius: 6, padding: '3px 8px', fontSize: 11, fontFamily: 'Inter, sans-serif', cursor: 'pointer', fontWeight: 600 }}
                >
                  {REGIME_OPTIONS.map(o => (<option key={o.id} value={o.id}>{o.label}</option>))}
                </select>
              </div>
              {/* Phase 5.4 — Native Refresh Data button. Fires update-all server-side and shows a transient loading state. */}
              <button onClick={triggerRefresh} disabled={refreshState === 'refreshing'} title="Trigger a fresh server-side data pull (?mode=update-all)"
                style={{
                  background: refreshState === 'done' ? C.green : refreshState === 'refreshing' ? C.amber : 'transparent',
                  border: '1px solid ' + (refreshState === 'done' ? C.green : refreshState === 'refreshing' ? C.amber : C.border),
                  color: (refreshState === 'done' || refreshState === 'refreshing') ? '#ffffff' : C.textSec,
