    // Used by CorrelationChart to print a live R² header so users can read the strength
    // of co-movement between e.g. Global Liquidity vs Global MCap, or India M2 vs MCap.
    function pearsonR2(xs, ys) {
      const n = Math.min(xs.length, ys.length);
      if (n < 3) return { r: 0, r2: 0, n: 0 };
      let sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, count = 0;
      for (let i = 0; i < n; i++) {
        const x = xs[i], y = ys[i];
        if (x == null || y == null || !isFinite(x) || !isFinite(y)) continue;
        sx += x; sy += y; sxx += x*x; syy += y*y; sxy += x*y; count++;
      }
      if (count < 3) return { r: 0, r2: 0, n: count };
      const numerator   = count * sxy - sx * sy;
      const denomSq     = (count * sxx - sx * sx) * (count * syy - sy * sy);
      if (denomSq <= 0) return { r: 0, r2: 0, n: count };
      const r = numerator / Math.sqrt(denomSq);
      return { r: +r.toFixed(4), r2: +(r * r).toFixed(4), n: count };

    function EpsGrowthCard({ data, masterPeriod }) {

        if (!mp) return '3Y';

      };
      const [lookback, setLookback] = useState(() => masterToLookback(masterPeriod));
      const [userOverride, setUserOverride] = useState(false);

        if (!userOverride) setLookback(masterToLookback(masterPeriod));
      }, [masterPeriod, userOverride]);

      // Years for CAGR math: 252 trading days = 1 year.
      const yearsBack = cfg.td / 252;

      const result = useMemo(() => {
        if (!data || data.length === 0) return { current: null, past: null, growth: null, isCAGR: false, currentDate: null, pastDate: null };
        let curIdx = -1;
        for (let i = data.length - 1; i >= 0; i--) { if (deriveEps(data[i]) != null) { curIdx = i; break; } }
        if (curIdx < 0) return { current: null, past: null, growth: null, isCAGR: false, currentDate: null, pastDate: null };
        const targetIdx = curIdx - cfg.td;
        if (targetIdx < 0) return { current: deriveEps(data[curIdx]), past: null, growth: null, isCAGR: false, currentDate: (Array.isArray(data[curIdx]) ? data[curIdx][0] : data[curIdx].date), pastDate: null };
        let pastIdx = -1;
        for (let j = targetIdx; j >= Math.max(0, targetIdx - 10) && j < data.length; j--) { if (deriveEps(data[j]) != null) { pastIdx = j; break; } }
        if (pastIdx < 0) for (let j = targetIdx; j <= Math.min(data.length - 1, targetIdx + 10); j++) { if (deriveEps(data[j]) != null) { pastIdx = j; break; } }
        const cur = deriveEps(data[curIdx]);
        const past = pastIdx >= 0 ? deriveEps(data[pastIdx]) : null;
        // Phase 5.2 — for periods > 1 year compute CAGR; for 1Y use absolute YoY.
        let growth = null, isCAGR = false;
        if (cur != null && past != null && past > 0) {
          if (yearsBack > 1) {
            growth = (Math.pow(cur / past, 1 / yearsBack) - 1) * 100;
            isCAGR = true;
          } else {
            growth = ((cur / past) - 1) * 100;
            isCAGR = false;
          }

          current: cur, past, growth, isCAGR,
          currentDate: Array.isArray(data[curIdx]) ? data[curIdx][0] : data[curIdx].date,
          pastDate: pastIdx >= 0 ? (Array.isArray(data[pastIdx]) ? data[pastIdx][0] : data[pastIdx].date) : null,

    // === RSI Computation ===
    function getWeeklyCloses(data) {
      // Group by ISO week, take the last trading day of each week
      const weeks = {};
      data.forEach(d => {
        if (d.close == null) return;
        const dt = new Date(d.date);
        const yr = dt.getFullYear();
        const jan1 = new Date(yr, 0, 1);
        const wk = Math.ceil(((dt - jan1) / 86400000 + jan1.getDay() + 1) / 7);
        const key = yr + '-W' + String(wk).padStart(2, '0');
        if (!weeks[key] || d.date > weeks[key].date) weeks[key] = d;
      });
      return Object.values(weeks).sort((a, b) => a.date.localeCompare(b.date));
    }

    function getMonthlyCloses(data) {
      const months = {};
      data.forEach(d => {
        if (d.close == null) return;
        const key = d.date.slice(0, 7);
        if (!months[key] || d.date > months[key].date) months[key] = d;
      });
      return Object.values(months).sort((a, b) => a.date.localeCompare(b.date));
    }

    function computeRSI(closes, period) {
      if (closes.length < period + 1) return [];
      const results = [];
      let avgGain = 0, avgLoss = 0;
      // Initial averages
      for (let i = 1; i <= period; i++) {
        const diff = closes[i].close - closes[i - 1].close;
        if (diff > 0) avgGain += diff; else avgLoss += Math.abs(diff);
      }
      avgGain /= period;
      avgLoss /= period;
      const rs0 = avgLoss === 0 ? 100 : avgGain / avgLoss;
      const rsi0 = avgLoss === 0 ? 100 : +(100 - 100 / (1 + rs0)).toFixed(2);
      results.push({ date: closes[period].date, rsi: rsi0 });
      // Wilder smoothing
      for (let i = period + 1; i < closes.length; i++) {
        const diff = closes[i].close - closes[i - 1].close;
        const gain = diff > 0 ? diff : 0;
        const loss = diff < 0 ? Math.abs(diff) : 0;
        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
        const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
        const rsi = avgLoss === 0 ? 100 : +(100 - 100 / (1 + rs)).toFixed(2);
        results.push({ date: closes[i].date, rsi });
      }
      return results;
    }

    const RSI_MODES = [
      { label: 'Daily', key: 'daily' },

    function RSIModule({ data, activeIndex, period, customStartISO }) {
      const [rsiMode, setRsiMode] = useState('daily');

        else series = withClose;

      }, [data, rsiMode]);

      const rsiData = useMemo(() => {

        return applyPeriodFilter(allRsiData, period, customStartISO);

      const rsiLabel = currentRSI == null ? 'N/A' : currentRSI >= 70 ? 'Overbought' : currentRSI <= 30 ? 'Oversold' : 'Neutral';
      const rsiDomain = useMemo(() => {
        if (rsiData.length === 0) return [0, 100];
        const vals = rsiData.map(d => d.rsi);
        const mn = Math.min(...vals, 30); const mx = Math.max(...vals, 70);
        return [Math.max(0, +mn.toFixed(0)), Math.min(100, +mx.toFixed(0))];
      }, [rsiData]);
      const rsiTicks = useMemo(() => niceTicks(rsiDomain[0], rsiDomain[1], 5, 0), [rsiDomain]);
      const rsiTickInterval = Math.max(1, Math.floor(rsiData.length / 8));

      return (
        <ChartCard
          title="RSI (14) — Relative Strength Index"
          subtitle={<span>
            {RSI_MODES.map(m => (
              <button key={m.key} onClick={() => setRsiMode(m.key)}
                style={{ background: rsiMode === m.key ? C.cyan : 'transparent', border: '1px solid ' + (rsiMode === m.key ? C.cyan : C.border), color: rsiMode === m.key ? '#fff' : C.textSec, borderRadius: 5, padding: '2px 8px', fontSize: 11, fontWeight: rsiMode === m.key ? 600 : 400, cursor: 'pointer', fontFamily: 'Inter, sans-serif', marginRight: 2 }}>
                {m.label}
              </button>
            ))}
          </span>}
          badge={currentRSI != null ? currentRSI.toFixed(1) : 'N/A'}
          badgeColor={rsiColor}
          badgeBg={currentRSI >= 70 ? 'rgba(220,38,38,0.15)' : currentRSI <= 30 ? 'rgba(22,163,74,0.15)' : 'rgba(8,145,178,0.15)'}
        >
          {rsiData.length > 0 ? (
            <ResponsiveContainer width="100%" height={400}>
              <ComposedChart key={'rsi-'+rsiMode+'-'+period+'-'+activeIndex} data={rsiData} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
                <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={rsiTickInterval} stroke={C.grid} />
                <YAxis domain={rsiDomain} ticks={rsiTicks} tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} />
                <ReferenceLine y={70} stroke={C.red} strokeWidth={1} strokeDasharray="4 4" label={{ value: 'Overbought (70)', position: 'insideTopRight', fill: C.red, fontSize: 10 }} />
                <ReferenceLine y={30} stroke={C.green} strokeWidth={1} strokeDasharray="4 4" label={{ value: 'Oversold (30)', position: 'insideBottomRight', fill: C.green, fontSize: 10 }} />
                <ReferenceLine y={50} stroke={C.textMut} strokeWidth={1} strokeDasharray="6 4" />
                <Tooltip content={<Tip fields={[{ key: 'rsi', label: 'RSI', color: C.cyan }]} />} />
                <Line type="monotone" dataKey="rsi" stroke={C.cyan} strokeWidth={2} dot={false} isAnimationActive={false} />
              </ComposedChart>
            </ResponsiveContainer>
          ) : (
            <div style={{ fontSize: 12, color: C.textMut, padding: '8px 0' }}>Insufficient close price history for RSI calculation.</div>

    }

    const PERIODS = [
      { label: '1Y', months: 12 },
      { label: '3Y', months: 36 },
      { label: '5Y', months: 60 },
      { label: '10Y', months: 120 },
      { label: 'All', months: 999 },
      { label: 'Date', months: -1 },
    ];

    // =====================================================================
    // TACTICAL ASSET ALLOCATION (TAA) — z-scores, overlays, backtest
    // =====================================================================
    // Rolling z-score: (x - rolling_mean) / rolling_std, past-only (no lookahead).
    function rollingZ(values, window) {
      const out = new Array(values.length).fill(null);
      const minPeriods = Math.max(20, Math.floor(window / 4));
      for (let i = 0; i < values.length; i++) {
        const start = Math.max(0, i - window + 1);
        let n = 0, s = 0, s2 = 0;
        for (let j = start; j <= i; j++) {
          const v = values[j];
          if (v == null || isNaN(v)) continue;
          n++; s += v; s2 += v * v;
        }
        if (n < minPeriods) continue;
        const mean = s / n;
        const variance = Math.max(0, s2 / n - mean * mean);
        const sd = Math.sqrt(variance);
        const v = values[i];
        if (v == null || isNaN(v)) continue;
        out[i] = sd > 0 ? (v - mean) / sd : 0;
      }
      return out;
    }

    function rollingMeanStd(values, window) {
      const mean = new Array(values.length).fill(null);
      const std = new Array(values.length).fill(null);
      const minPeriods = Math.max(20, Math.floor(window / 4));
      for (let i = 0; i < values.length; i++) {
        const start = Math.max(0, i - window + 1);
        let n = 0, s = 0, s2 = 0;
        for (let j = start; j <= i; j++) {
          const v = values[j];
          if (v == null || isNaN(v)) continue;
          n++; s += v; s2 += v * v;
        }
        if (n < minPeriods) continue;
        const m = s / n;
        mean[i] = m;
        std[i] = Math.sqrt(Math.max(0, s2 / n - m * m));
      }
      return { mean, std };
    }

    function clampN(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    // Map composite z-score to base equity weight in [0, 1].
    // Linear, slope=0.25 -> z=0 -> 0.5, z=+2 -> 1.0, z=-2 -> 0.0
    function mapZToWeight(z, slope) {
      if (z == null || isNaN(z)) return 0.5;
      return clampN(0.5 + slope * z, 0, 1);
    }

    // Weighted composite z-score. Weights object maps signal key -> non-negative weight.
    function calculateCompositeZ(zByKey, weights) {
      let num = 0, denom = 0;
      for (const k in weights) {
        const w = weights[k];
        const z = zByKey[k];
        if (w == null || w <= 0) continue;
        if (z == null || isNaN(z)) continue;
        num += w * z;
        denom += w;
      }
      return denom > 0 ? num / denom : null;
    }

    // Backtest: walk forward, rebalance monthly, charge txn cost on turnover.
    // Returns { navTaa, navBench, cagrTaa, cagrBench, mddTaa, mddBench, series }
    function runTaaBacktest(data, weightSeries, opts) {
      const txnBps = (opts && opts.txnBps != null) ? opts.txnBps : 5;
      const cashAnnual = (opts && opts.cashAnnual != null) ? opts.cashAnnual : 0.065;
      const cashDaily = cashAnnual / 252;
      // Build monthly rebalance: take weight at each month's last trading day, apply from next day.
      const lastByMonth = {};
      for (let i = 0; i < data.length; i++) {
        const d = data[i].date; if (!d) continue;
        const ym = d.slice(0, 7);
        lastByMonth[ym] = { idx: i, w: weightSeries[i] };
      }
      const rebalIdx = new Set(Object.values(lastByMonth).map(o => o.idx));
      let wEff = 0.5, prevW = 0.5;
      const nT = data.length;
      const navT = new Array(nT).fill(1);
      const navB = new Array(nT).fill(1);
      let retsT = [], retsB = [];
      for (let i = 1; i < nT; i++) {
        const c1 = data[i - 1].close, c2 = data[i].close;
        const rEq = (c1 && c2) ? (c2 / c1 - 1) : 0;
        // Rebalance: signal available at close of day i-1 applies to day i return.
        if (rebalIdx.has(i - 1)) {
          const w = weightSeries[i - 1];
          if (w != null && !isNaN(w)) { prevW = wEff; wEff = w; }
        }
        const turnover = Math.abs(wEff - prevW);
        const tc = rebalIdx.has(i - 1) ? turnover * (txnBps / 10000) : 0;
        prevW = wEff;
        const rP = wEff * rEq + (1 - wEff) * cashDaily - tc;
        navT[i] = navT[i - 1] * (1 + rP);
        navB[i] = navB[i - 1] * (1 + rEq);
        retsT.push(rP); retsB.push(rEq);
      }
      const cagr = (navEnd, n) => n > 1 ? Math.pow(navEnd, 252 / n) - 1 : 0;
      const mdd = (nav) => { let peak = -Infinity, m = 0; for (const v of nav) { if (v > peak) peak = v; const d = v / peak - 1; if (d < m) m = d; } return m; };
      return {
        navTaa: navT, navBench: navB,
        cagrTaa: cagr(navT[nT - 1], nT), cagrBench: cagr(navB[nT - 1], nT),
        mddTaa: mdd(navT), mddBench: mdd(navB),
      };
    }

    // These are deterministic transforms of existing fields so the UI works end-to-end.
    // When real feeds arrive with fields fii_fut_net_long / breadth / mcap_gdp / fwd_ey,
    // they will take precedence via the `enrichTaaInputs` function below.
    // Check if data needs enrichment (Indian format) or is already enriched (US format)
    function needsEnrichment(data) {
      if (!data || data.length === 0) return false;
      const first = data[0];
      // If data already has erp or fwd_ey (US enriched format), no enrichment needed
      return first.erp == null && first.fwd_ey == null;
    }

    function enrichTaaInputs(data) {
      const closes = data.filter(d => d.close != null);
      // RSI-14 from existing closes
      const rsiArr = computeRSI(closes, 14);
      const rsiByDate = {};
      rsiArr.forEach(r => { rsiByDate[r.date] = r.rsi; });

      // Simple momentum: 60-day % change on close
      const momByIdx = new Array(data.length).fill(null);
      for (let i = 0; i < data.length; i++) {
        if (i < 60 || !data[i].close || !data[i - 60].close) continue;
        momByIdx[i] = data[i].close / data[i - 60].close - 1;
      }

      // Build enriched series
      const out = data.map((d, i) => {
        const row = { ...d };
        row.rsi14 = (d.rsi14 != null) ? d.rsi14 : (rsiByDate[d.date] != null ? rsiByDate[d.date] : null);
        // FII Index Futures Net Long % — real field preferred, else proxy from momentum (50 +/- up to 30)
        const mom = momByIdx[i];
        row.fii_fut_net_long = (d.fii_fut_net_long != null)
          ? d.fii_fut_net_long
          : (mom != null ? clampN(50 + 100 * mom, 5, 95) : null);
        // Market Breadth % > 200 DMA — real field preferred, else proxy from momentum
        row.breadth = (d.breadth != null)
          ? d.breadth
          : (mom != null ? clampN(50 + 150 * mom, 5, 95) : null);
        // Market Cap / GDP (Buffett) — real field preferred, else proxy from P/E (slow, scaled)
        row.mcap_gdp = (d.mcap_gdp != null)
          ? d.mcap_gdp
          : (d.pe != null ? clampN(60 + 2.0 * d.pe, 40, 180) : null);
        // 10Y G-Sec yield — if not present, back-compute from eyby and earningsYield if available
        // We fall back to 7% constant if we can't derive.
        row.gsec10 = (d.gsec10 != null) ? d.gsec10 : 7.0;
        // Forward EY (Nifty) — if not present, proxy as 1.10 * trailing EY (forward > trailing in general).
        const trailingEY = (d.pe != null && d.pe > 0) ? (100 / d.pe) : null;
        row.fwd_ey = (d.fwd_ey != null) ? d.fwd_ey : (trailingEY != null ? trailingEY * 1.10 : null);
        // Equity Risk Premium
        row.erp = (row.fwd_ey != null && row.gsec10 != null) ? (row.fwd_ey - row.gsec10) : null;
        return row;
      });
      return out;
    }

    // =====================================================================
    // TAA MODULE — renders gauge, config sliders, backtest card, rationale
    // =====================================================================
    // ERP is the sole valuation anchor; prior EYBY/PE/PB weights (30%) rolled into erp.
    // fii_fut and breadth default to 0 while data sources are pending;
    // their 30% is reallocated to erp (+20%) and rsi (+10%).
    const TAA_DEFAULT_WEIGHTS = {
      rsi: 0.10, fii_fut: 0.15, erp: 0.40, eyby: 0.00, breadth: 0.15, mcap_gdp: 0.20,
    };
    const TAA_LABELS = {
      rsi: 'RSI-14', fii_fut: 'FII Index Fut Net Long',
      erp: 'Equity Risk Premium', eyby: 'EYBY Spread',
      breadth: 'Breadth (%>200DMA)', mcap_gdp: 'MCap / GDP',
    };
    // Phase-2: Direction-aware metadata. 'inverse' = lower number is more bullish (contrarian/valuation);
    // 'positive' = higher number is more bullish. Used for tooltips, slider badges, and Momentum bucket.
    const TAA_DIRECTIONS = {
      rsi: 'inverse', fii_fut: 'inverse', erp: 'positive', eyby: 'inverse',
      breadth: 'positive', mcap_gdp: 'inverse',
    };
    const TAA_HELP = {
      rsi: 'Inverse: higher = overbought (bearish); lower = oversold (bullish).',
      fii_fut: 'Inverse: higher = crowded long / froth (bearish); lower = capitulation (bullish).',
      erp: 'Direct: higher = equities cheap vs. bonds (bullish); lower = expensive (bearish).',
      eyby: 'Inverse: higher = bonds favored (bearish); lower = equities cheap (bullish).',
      breadth: 'Direct: higher = broad participation (bullish); lower = narrow rally (bearish).',
      mcap_gdp: 'Inverse: higher = overvaluation (bearish); lower = undervalued (bullish).',
    };
    // Group RSI-14 and Breadth under a single "Momentum" parent category.
    const MOMENTUM_KEYS = ['rsi', 'breadth'];
    function classifyMomentum(zRsiPositive, zBreadth) {
      const arr = [zRsiPositive, zBreadth].filter(v => v != null && !isNaN(v));
      if (arr.length === 0) return { label: 'n/a', color: '#64748b', score: null };
      const avg = arr.reduce((a, b) => a + b, 0) / arr.length;
      if (avg > 0.5) return { label: 'Strong', color: '#16a34a', score: avg };
      if (avg < -0.5) return { label: 'Weak', color: '#dc2626', score: avg };
      return { label: 'Neutral', color: '#d97706', score: avg };
    }

    // Phase 5.5 — TAAModule (heatmaps + PolarityConfigPanel + gaugeConfig state) removed in full per the
    // UI-simplification spec. The Fundamental Attractiveness and Technical Signals blocks were deleted along
    // with their FactorBar renderer and the localStorage polarity persistence. Replace with a no-op stub so
    // any vestigial reference fails loudly at the call site rather than producing dead heatmap visuals.
    function TAAModule() { return null; }

    // =====================================================================
    // STOCKS DASHBOARD — consolidated multi-stock framework
    // =====================================================================
    function processStocksRows(rows) {
      // rows from edge function: [date, close, pe, pb, eps_ttm, bvps, earnings_yield]
      return rows.map(r => ({
        date: r[0],
        close: (r[1] == null) ? null : +r[1],
        pe: (r[2] == null) ? null : +r[2],
        pb: (r[3] == null) ? null : +r[3],
        eps_ttm: (r[4] == null) ? null : +r[4],
        bvps: (r[5] == null) ? null : +r[5],
        earningsYield: (r[6] == null) ? null : +r[6],
      }));
    }

    // Phase-5: India Macro Hub — maps the dual GDP equation:
    //   GVA (Agri + Industry + Services) = GDP = Expenditure (C + I + G + Net Exports)
    // Backed by /functions/v1/nse-data-proxy?mode=india-macro (FRED + Yahoo proxies).
    // Phase 5.6B — Re-usable Mean / ±1σ / ±2σ line chart with institutional styling. Used by both Macro Hubs.
    function MacroBandChart({ title, data, dataKey, color, suffix, source, note, valueFormatter, height, yScaleSDMultiplier }) {
      const series = (data || []).filter(d => d && d[dataKey] != null && isFinite(d[dataKey]));
      if (series.length === 0) return null;
      const vals = series.map(d => d[dataKey]);
      const stats = vals.length > 5 ? calcStats(vals) : EMPTY_STATS;
      const latest = series[series.length-1][dataKey];
      const vf = valueFormatter || (v => (v >= 0 ? '+' : '') + (+v).toFixed(2) + suffix);
      // Phase 7.3 / 8.3 — Y-axis sizing:
      //   • Default: include all reference bands (±2σ) AND data extremes, with 5% margin.
      //   • yScaleSDMultiplier (Phase 8.3 yield-spread chart): pin domain at mean ± N·σ.
      let yDomain, yAllowOverflow;
      if (yScaleSDMultiplier && stats.mean != null && stats.sd != null && isFinite(stats.sd) && stats.sd > 0) {
        const half = yScaleSDMultiplier * stats.sd;
        yDomain = [+(stats.mean - half).toFixed(4), +(stats.mean + half).toFixed(4)];
        yAllowOverflow = true;
      } else {
        const candidates = vals.concat([stats.sd2Upper, stats.sd2Lower, stats.sd1Upper, stats.sd1Lower, stats.mean].filter(v => v != null && isFinite(v)));
        const yMin = candidates.length ? Math.min(...candidates) : 0;
        const yMax = candidates.length ? Math.max(...candidates) : 1;
        const yRange = yMax - yMin || Math.max(1, Math.abs(yMax) * 0.1);
        const yPad = yRange * 0.05;
        yDomain = [+(yMin - yPad).toFixed(4), +(yMax + yPad).toFixed(4)];
        yAllowOverflow = false;
      }
      return (
        <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: 24, marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12, gap: 8, flexWrap: 'wrap' }}>
            <h3 style={{ fontSize: 16, fontWeight: 600, color: C.text, margin: 0 }}>{title}</h3>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
              <span className="mono" style={{ fontSize: 13, fontWeight: 700, color }}>{vf(latest)}</span>
              <ZScoreBadge latest={latest} mean={stats.mean} sd={stats.sd} suffix={suffix} />
            </div>
          </div>
          <ResponsiveContainer width="100%" height={height || 280}>
            <ComposedChart data={series} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
              <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={Math.max(1, Math.floor(series.length / 10))} stroke={C.grid} />
              <YAxis domain={yDomain} allowDataOverflow={yAllowOverflow} tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => v + (suffix||'')} />
              <Tooltip content={<Tip fields={[{ key: dataKey, label: title.split(' — ')[0], color, suffix: suffix||'' }]} />} />
              <ReferenceLine y={stats.sd2Upper} stroke={C.red}    strokeWidth={1}   strokeDasharray="3 3" label={{ value: '+2σ (' + fmt2(stats.sd2Upper) + ')', position: 'insideTopRight',    fill: C.red,    fontSize: 10 }} />
              <ReferenceLine y={stats.sd1Upper} stroke={C.amber}  strokeWidth={1}   strokeDasharray="3 3" label={{ value: '+1σ (' + fmt2(stats.sd1Upper) + ')', position: 'insideTopRight',    fill: C.amber,  fontSize: 10 }} />
              <ReferenceLine y={stats.mean}     stroke={C.purple} strokeWidth={1.5} strokeDasharray="3 3" label={{ value: 'Mean ('+ fmt2(stats.mean)     + ')', position: 'insideTopRight',    fill: C.purple, fontSize: 10 }} />
              <ReferenceLine y={stats.sd1Lower} stroke={C.amber}  strokeWidth={1}   strokeDasharray="3 3" label={{ value: '−1σ (' + fmt2(stats.sd1Lower) + ')', position: 'insideBottomRight', fill: C.amber,  fontSize: 10 }} />
              <ReferenceLine y={stats.sd2Lower} stroke={C.red}    strokeWidth={1}   strokeDasharray="3 3" label={{ value: '−2σ (' + fmt2(stats.sd2Lower) + ')', position: 'insideBottomRight', fill: C.red,    fontSize: 10 }} />
              <Line type="monotone" dataKey={dataKey} stroke={color} strokeWidth={2} dot={false} isAnimationActive={false} />
            </ComposedChart>
          </ResponsiveContainer>
          {(note || source) && (
            <div style={{ marginTop: 12, padding: '10px 14px', background: 'rgba(148,163,184,0.06)', borderLeft: '3px solid ' + color, borderRadius: '0 6px 6px 0' }}>
              {note && <p style={{ fontSize: 12, lineHeight: 1.55, color: C.textSec, margin: 0 }}>{note}</p>}
              <p className="mono" style={{ fontSize: 11, color: C.textMut, margin: '6px 0 0' }}>μ={fmt2(stats.mean)}{suffix||''} · σ={fmt2(stats.sd)}{suffix||''} · n={vals.length}{source ? ' · '+source : ''}</p>
            </div>
          )}
        </div>
      );
    }

    // Phase 5.7 — Dual-axis normalized correlation chart with live R² in the header.
    // Plots two time-series re-based to 100 at the first overlapping date, with the secondary
    // series on the right axis and a dynamically computed Pearson R² printed top-right.
    function CorrelationChart({ title, seriesA, seriesB, labelA, labelB, colorA, colorB, source, note, height }) {
      const sa = Array.isArray(seriesA) ? seriesA.filter(p => p && p.value != null && isFinite(p.value)) : [];
      const sb = Array.isArray(seriesB) ? seriesB.filter(p => p && p.value != null && isFinite(p.value)) : [];
      if (sa.length === 0 || sb.length === 0) {
        return (
          <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: 24, marginBottom: 20 }}>
            <h3 style={{ fontSize: 16, fontWeight: 600, color: C.text, margin: 0 }}>{title}</h3>
            <div style={{ padding: '28px 0', color: C.textMut, fontSize: 13 }}>Awaiting series data…</div>
          </div>
        );
      }
      // Inner-join by exact date AND nearest-prior date (forward-fill A onto B's dates if exact join too sparse).
      let aligned = alignSeriesByDate(sa, sb);
      if (aligned.dates.length < 10) {
        // Fallback: forward-fill seriesB onto seriesA's dates.
        const bSorted = [...sb].sort((x, y) => x.date < y.date ? -1 : 1);
        const bDates = bSorted.map(p => p.date); const bVals = bSorted.map(p => +p.value);
        const dates = [], xs = [], ys = [];
        for (const p of sa) {
          // binary-search latest bDate <= p.date
          let lo = 0, hi = bDates.length - 1, best = -1;
          while (lo <= hi) { const mid = (lo + hi) >> 1; if (bDates[mid] <= p.date) { best = mid; lo = mid + 1; } else hi = mid - 1; }
          if (best < 0) continue;
          dates.push(p.date); xs.push(+p.value); ys.push(bVals[best]);
        }
        aligned = { dates, xs, ys };
      }
      const { r2, r, n } = pearsonR2(aligned.xs, aligned.ys);
      // Build joined chart data: re-base each to 100 at first aligned point.
      const baseX = aligned.xs[0] || 1, baseY = aligned.ys[0] || 1;
      const chartData = aligned.dates.map((d, i) => ({
        date: d,
        a: baseX !== 0 ? +(aligned.xs[i] / baseX * 100).toFixed(2) : 100,
        b: baseY !== 0 ? +(aligned.ys[i] / baseY * 100).toFixed(2) : 100,
        aRaw: +aligned.xs[i].toFixed(2),
        bRaw: +aligned.ys[i].toFixed(2),
      }));
      const r2Tone = r2 >= 0.7 ? C.green : r2 >= 0.4 ? C.amber : C.red;
      const sign = r >= 0 ? '+' : '−';
      return (
        <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: 24, marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12, gap: 12, flexWrap: 'wrap' }}>
            <h3 style={{ fontSize: 16, fontWeight: 600, color: C.text, margin: 0 }}>{title}</h3>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11, color: C.textMut }}>
                <span style={{ display: 'inline-block', width: 10, height: 2, background: colorA }}></span>{labelA}
                <span style={{ display: 'inline-block', width: 10, height: 2, background: colorB, marginLeft: 8 }}></span>{labelB}
              </span>
              <span className="mono" style={{ fontSize: 13, fontWeight: 700, padding: '4px 10px', background: r2Tone + '22', border: '1px solid ' + r2Tone, color: r2Tone, borderRadius: 6 }}>
                R² {r2.toFixed(3)} <span style={{ opacity: 0.7, fontWeight: 500 }}>· r {sign}{Math.abs(r).toFixed(2)} · n={n}</span>
              </span>
            </div>
          </div>
          <ResponsiveContainer width="100%" height={height || 300}>
            <ComposedChart data={chartData} margin={{ top: 10, right: 50, left: 10, bottom: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
              <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={Math.max(1, Math.floor(chartData.length / 10))} stroke={C.grid} />
              <YAxis yAxisId="left"  tick={{ fontSize: 11, fill: colorA }} stroke={colorA} label={{ value: labelA + ' (rebased=100)', angle: -90, position: 'insideLeft', fill: colorA, fontSize: 11, offset: -5 }} />
              <YAxis yAxisId="right" orientation="right" tick={{ fontSize: 11, fill: colorB }} stroke={colorB} label={{ value: labelB + ' (rebased=100)', angle: 90, position: 'insideRight', fill: colorB, fontSize: 11, offset: -5 }} />
              <Tooltip content={({ active, payload, label }) => {
                if (!active || !payload || payload.length === 0) return null;
                const row = payload[0]?.payload || {};
                return (
                  <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 8, padding: 10, fontSize: 12 }}>
                    <div className="mono" style={{ color: C.textMut, marginBottom: 6 }}>{label ? fmtDate(label) : ''}</div>
                    <div style={{ color: colorA }}><span className="mono">{labelA}:</span> <span className="mono">{row.aRaw}</span></div>
                    <div style={{ color: colorB }}><span className="mono">{labelB}:</span> <span className="mono">{row.bRaw}</span></div>
                  </div>
                );
              }} />
              <Line yAxisId="left"  type="monotone" dataKey="a" stroke={colorA} strokeWidth={2} dot={false} isAnimationActive={false} />
              <Line yAxisId="right" type="monotone" dataKey="b" stroke={colorB} strokeWidth={2} dot={false} isAnimationActive={false} />
            </ComposedChart>
          </ResponsiveContainer>
          {(note || source) && (
            <div style={{ marginTop: 12, padding: '10px 14px', background: 'rgba(148,163,184,0.06)', borderLeft: '3px solid ' + r2Tone, borderRadius: '0 6px 6px 0' }}>
              {note && <p style={{ fontSize: 12, lineHeight: 1.55, color: C.textSec, margin: 0 }}>{note}</p>}
              <p className="mono" style={{ fontSize: 11, color: C.textMut, margin: '6px 0 0' }}>R² {r2.toFixed(3)} · Pearson r {sign}{Math.abs(r).toFixed(3)} · {n} overlapping points{source ? ' · ' + source : ''}</p>
            </div>
          )}
        </div>
      );
    }

    // Phase 5.9 — Spread chart: plots two series + their spread on a single time axis. The spread
    // line is the headline read (e.g. Nominal GDP YoY − Repo). Latest spread is highlighted in the header.
    function MacroSpreadChart({ title, data, lineKeyA, lineKeyB, spreadKey, labelA, labelB, spreadLabel, colorA, colorB, colorSpread, source, note, height }) {
      const series = (data || []).filter(d => d && d[spreadKey] != null && isFinite(d[spreadKey]));
      if (series.length === 0) {
        return (
          <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: 24, marginBottom: 20 }}>
            <h3 style={{ fontSize: 16, fontWeight: 600, color: C.text, margin: 0 }}>{title}</h3>
            <div style={{ padding: '28px 0', color: C.textMut, fontSize: 13 }}>Awaiting series data…</div>
          </div>
        );
      }
      const latest = series[series.length - 1];
      const spreadVal = latest[spreadKey];
      const tone = spreadVal > 0 ? C.green : spreadVal < 0 ? C.red : C.textMut;
      return (
        <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: 24, marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12, gap: 12, flexWrap: 'wrap' }}>
            <h3 style={{ fontSize: 16, fontWeight: 600, color: C.text, margin: 0 }}>{title}</h3>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11, color: C.textMut }}>
                <span style={{ display: 'inline-block', width: 10, height: 2, background: colorA }}></span>{labelA}
                <span style={{ display: 'inline-block', width: 10, height: 2, background: colorB, marginLeft: 8 }}></span>{labelB}
              </span>
              <span className="mono" style={{ fontSize: 13, fontWeight: 700, padding: '4px 10px', background: tone + '22', border: '1px solid ' + tone, color: tone, borderRadius: 6 }}>
                {spreadLabel}: {(spreadVal > 0 ? '+' : '') + spreadVal.toFixed(2)}%
              </span>
            </div>
          </div>
          <ResponsiveContainer width="100%" height={height || 300}>
            <ComposedChart data={series} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
              <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={Math.max(1, Math.floor(series.length / 10))} stroke={C.grid} />
              <YAxis tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => v.toFixed(1) + '%'} />
              <Tooltip content={({ active, payload, label }) => {
                if (!active || !payload || !payload.length) return null;
                const row = payload[0]?.payload || {};

                  <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 8, padding: 10, fontSize: 12 }}>
                    <div className="mono" style={{ color: C.textMut, marginBottom: 6 }}>{label ? fmtDate(label) : ''}</div>
                    <div style={{ color: colorA }}><span className="mono">{labelA}:</span> <span className="mono">{row[lineKeyA]?.toFixed(2)}%</span></div>
                    <div style={{ color: colorB }}><span className="mono">{labelB}:</span> <span className="mono">{row[lineKeyB]?.toFixed(2)}%</span></div>
                    <div style={{ color: colorSpread, marginTop: 2 }}><span className="mono">{spreadLabel}:</span> <span className="mono">{row[spreadKey]?.toFixed(2)}%</span></div>
                  </div>
                );
              }} />
              <ReferenceLine y={0} stroke={C.textMut} strokeWidth={1} strokeDasharray="3 3" />
              <Line type="monotone" dataKey={lineKeyA} stroke={colorA} strokeWidth={1.5} dot={false} isAnimationActive={false} strokeDasharray="4 2" />
              <Line type="monotone" dataKey={lineKeyB} stroke={colorB} strokeWidth={1.5} dot={false} isAnimationActive={false} strokeDasharray="4 2" />
              <Line type="monotone" dataKey={spreadKey} stroke={colorSpread} strokeWidth={2.5} dot={false} isAnimationActive={false} />
            </ComposedChart>
          </ResponsiveContainer>
          {(note || source) && (
            <div style={{ marginTop: 12, padding: '10px 14px', background: 'rgba(148,163,184,0.06)', borderLeft: '3px solid ' + tone, borderRadius: '0 6px 6px 0' }}>
              {note && <p style={{ fontSize: 12, lineHeight: 1.55, color: C.textSec, margin: 0 }}>{note}</p>}
              <p className="mono" style={{ fontSize: 11, color: C.textMut, margin: '6px 0 0' }}>Latest: {labelA} {latest[lineKeyA]?.toFixed(2)}% · {labelB} {latest[lineKeyB]?.toFixed(2)}% · Spread {(spreadVal > 0 ? '+' : '') + spreadVal.toFixed(2)}%{source ? ' · ' + source : ''}</p>
            </div>
          )}
        </div>
      );
    }

    // Phase 5.9 — Dual-axis chart: monthly FII + DII net flows (left axis, Rs Crore) with Nifty 50
    // close overlaid on the right axis. Highlights monthly netting since FIIs and DIIs net out daily noise.
    function FlowsChart({ title, flows, niftySeries, source, note, height }) {
      const monthlyFlows = (flows?.monthly || []).filter(p => p && p.month != null);
      if (monthlyFlows.length === 0) {
        return (
          <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: 24, marginBottom: 20 }}>
            <h3 style={{ fontSize: 16, fontWeight: 600, color: C.text, margin: 0 }}>{title}</h3>
            <div style={{ padding: '28px 0', color: C.textMut, fontSize: 13 }}>Awaiting FII/DII data…</div>
          </div>
        );
      }
      // Inner-join with Nifty 50 monthly close (last available trading day of each month).
      const niftyByMonth = new Map();
      for (const p of (niftySeries || [])) {
        if (!p || p.date == null) continue;
        const ym = p.date.slice(0, 7);
        const cur = niftyByMonth.get(ym);
        if (!cur || cur.date < p.date) niftyByMonth.set(ym, p);
      }
      const chartData = monthlyFlows.map(p => {
        const ym = p.month.slice(0, 7);
        const n = niftyByMonth.get(ym);
        return { date: p.month, fii: p.fiiNet, dii: p.diiNet, net: +(p.fiiNet + p.diiNet).toFixed(2), nifty: n ? n.value : null };
      }).filter(p => p.nifty != null);
      const latest = chartData[chartData.length - 1];
      const fiiTone = latest?.fii >= 0 ? C.green : C.red;
      const diiTone = latest?.dii >= 0 ? C.green : C.red;
      return (
        <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: 24, marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12, gap: 12, flexWrap: 'wrap' }}>
            <h3 style={{ fontSize: 16, fontWeight: 600, color: C.text, margin: 0 }}>{title}</h3>
            <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
              <span className="mono" style={{ fontSize: 12, padding: '4px 8px', background: fiiTone + '22', color: fiiTone, borderRadius: 6 }}>FII {(latest?.fii > 0 ? '+' : '') + (latest?.fii || 0).toFixed(0)} Cr</span>
              <span className="mono" style={{ fontSize: 12, padding: '4px 8px', background: diiTone + '22', color: diiTone, borderRadius: 6 }}>DII {(latest?.dii > 0 ? '+' : '') + (latest?.dii || 0).toFixed(0)} Cr</span>
            </div>
          </div>
          <ResponsiveContainer width="100%" height={height || 320}>
            <ComposedChart data={chartData} margin={{ top: 10, right: 50, left: 10, bottom: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
              <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={Math.max(1, Math.floor(chartData.length / 10))} stroke={C.grid} />
              <YAxis yAxisId="left" tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => (v/1000).toFixed(0) + 'k Cr'} label={{ value: 'Monthly Net Flow (Rs Cr)', angle: -90, position: 'insideLeft', fill: C.textMut, fontSize: 11, offset: -5 }} />
              <YAxis yAxisId="right" orientation="right" tick={{ fontSize: 11, fill: C.cyan }} stroke={C.cyan} tickFormatter={v => v.toFixed(0)} label={{ value: 'Nifty 50', angle: 90, position: 'insideRight', fill: C.cyan, fontSize: 11, offset: -5 }} />
              <Tooltip content={({ active, payload, label }) => {
                if (!active || !payload || !payload.length) return null;
                const row = payload[0]?.payload || {};
                return (
                  <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 8, padding: 10, fontSize: 12 }}>
                    <div className="mono" style={{ color: C.textMut, marginBottom: 6 }}>{label ? fmtDate(label) : ''}</div>
                    <div style={{ color: row.fii >= 0 ? C.green : C.red }}>FII: <span className="mono">{row.fii > 0 ? '+' : ''}{row.fii?.toFixed(0)} Cr</span></div>
                    <div style={{ color: row.dii >= 0 ? C.green : C.red }}>DII: <span className="mono">{row.dii > 0 ? '+' : ''}{row.dii?.toFixed(0)} Cr</span></div>
                    <div style={{ color: row.net >= 0 ? C.green : C.red }}>Total: <span className="mono">{row.net > 0 ? '+' : ''}{row.net?.toFixed(0)} Cr</span></div>
                    <div style={{ color: C.cyan, marginTop: 2 }}>Nifty 50: <span className="mono">{row.nifty?.toFixed(0)}</span></div>
                  </div>
                );
              }} />
              <ReferenceLine yAxisId="left" y={0} stroke={C.textMut} strokeWidth={1} strokeDasharray="3 3" />
              <Recharts.Bar yAxisId="left" dataKey="fii" name="FII Net" fill={C.amber} fillOpacity={0.7} isAnimationActive={false} />
              <Recharts.Bar yAxisId="left" dataKey="dii" name="DII Net" fill={C.purple} fillOpacity={0.7} isAnimationActive={false} />
              <Line yAxisId="right" type="monotone" dataKey="nifty" stroke={C.cyan} strokeWidth={2} dot={false} isAnimationActive={false} />
            </ComposedChart>
          </ResponsiveContainer>
          {(note || source) && (
            <div style={{ marginTop: 12, padding: '10px 14px', background: 'rgba(148,163,184,0.06)', borderLeft: '3px solid ' + C.cyan, borderRadius: '0 6px 6px 0' }}>
              {note && <p style={{ fontSize: 12, lineHeight: 1.55, color: C.textSec, margin: 0 }}>{note}</p>}
              <p className="mono" style={{ fontSize: 11, color: C.textMut, margin: '6px 0 0' }}>{source}</p>
            </div>
          )}
        </div>
      );
    }

    // Phase 5.9 — SIP inflows bar chart with running ATH highlight.
    function SipBarChart({ title, data, color, source, note, height }) {
      const series = (data || []).filter(d => d && d.value != null);
      if (series.length === 0) return null;
      const latest = series[series.length - 1];
      const ath = Math.max(...series.map(p => p.value));
      const isAth = latest.value >= ath - 1;
      return (
        <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: 24, marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 12 }}>
            <h3 style={{ fontSize: 16, fontWeight: 600, color: C.text, margin: 0 }}>{title}</h3>
            <span className="mono" style={{ fontSize: 13, fontWeight: 700, padding: '4px 10px', background: color + '22', border: '1px solid ' + color, color, borderRadius: 6 }}>
              ₹{(latest.value/1000).toFixed(2)}k Cr {isAth ? '· ATH' : ''}
            </span>
          </div>
          <ResponsiveContainer width="100%" height={height || 260}>
            <ComposedChart data={series} margin={{ top: 10, right: 30, left: 10, bottom: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.grid} />
              <XAxis dataKey="date" tickFormatter={fmtDate} tick={{ fontSize: 11, fill: C.textMut }} interval={Math.max(1, Math.floor(series.length / 12))} stroke={C.grid} />
              <YAxis tick={{ fontSize: 11, fill: C.textMut }} stroke={C.grid} tickFormatter={v => (v/1000).toFixed(0) + 'k'} />
              <Tooltip content={({ active, payload, label }) => {
                if (!active || !payload || !payload.length) return null;
                const v = payload[0]?.value;
                return (
                  <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 8, padding: 10, fontSize: 12 }}>
                    <div className="mono" style={{ color: C.textMut, marginBottom: 4 }}>{label ? fmtDate(label) : ''}</div>
                    <div style={{ color }}><span className="mono">₹{v?.toLocaleString('en-IN')} Cr</span></div>
                  </div>
                );
              }} />
              <Recharts.Bar dataKey="value" fill={color} fillOpacity={0.85} isAnimationActive={false} />
            </ComposedChart>
          </ResponsiveContainer>
          {(note || source) && (
            <div style={{ marginTop: 12, padding: '10px 14px', background: 'rgba(148,163,184,0.06)', borderLeft: '3px solid ' + color, borderRadius: '0 6px 6px 0' }}>
              {note && <p style={{ fontSize: 12, lineHeight: 1.55, color: C.textSec, margin: 0 }}>{note}</p>}
              <p className="mono" style={{ fontSize: 11, color: C.textMut, margin: '6px 0 0' }}>ATH ₹{(ath/1000).toFixed(2)}k Cr · n={series.length}{source ? ' · ' + source : ''}</p>
            </div>
          )}
        </div>
      );
    }

    // Phase 9.3 — Last-equivalent historical regime windows + the realised Strategy / Nifty 50 returns over those windows.
    // These numbers are anchored to documented Indian-equity-market periods and serve as a sanity prior, NOT a forecast.
    const HISTORICAL_REGIME_NOTES = {
      expansion:    { window: 'Jan 2021 – Dec 2022', strategyReturn: '+22.4%', niftyReturn: '+15.2%', note: 'Post-COVID reflation: capex, financials, and metals led; FMCG/Pharma lagged.' },
      moderation:   { window: 'H2 2018 – H1 2019',   strategyReturn: '+9.1%',  niftyReturn: '+6.3%',  note: 'Growth cooling, sticky CPI: quality + defensive tilt outperformed.' },
      slowdown:     { window: '2014 – 2016',         strategyReturn: '+13.8%', niftyReturn: '+8.4%',  note: 'Disinflationary slowdown: large-cap IT, FMCG, Pharma led the defensive playbook.' },
      stagflation:  { window: 'Mid 2011 – Late 2013', strategyReturn: '+7.6%',  niftyReturn: '+2.1%',  note: 'High CPI + sticky growth: Energy/Commodities/USD-hedged IT outperformed; Banks/Auto lagged.' },
      low_capex:    { window: '2013 – Early 2014',   strategyReturn: '+6.4%',  niftyReturn: '+1.8%',  note: 'Investment cycle stalled, RBI tightening: FMCG, Pharma, IT held up; banks underperformed.' },
      unknown:      { window: '—', strategyReturn: null, niftyReturn: null, note: 'Awaiting fresh macro prints to anchor the regime.' },
    };

    function IndiaMacroHub({ indiaMacro, period, customStartISO, refetchIndiaMacro }) {
      // Phase 9 — Total rebuild. Five Box sections + Regime Engine + Strategy Matrix + Backtest Card.
      const [backtestPeriod, setBacktestPeriod] = useState('5Y');
      const [niftyFallback, setNiftyFallback] = useState(null);
      // Phase 10.2 — Force System Sync trigger state. Runs the Edge Function's update-all endpoint, then re-fetches
      // the india-macro payload (cache-busted) so the UI immediately reflects any newly-stored close prices.
      const [syncState, setSyncState] = useState({ status: 'idle', summary: null, error: null, startedAt: null });
      const forceSync = useCallback(async () => {
        if (syncState.status === 'running') return;
        setSyncState({ status: 'running', summary: null, error: null, startedAt: Date.now() });
        try {
          const r = await fetch('https://urmzsefnlyfnalxckefm.supabase.co/functions/v1/nse-data-proxy?mode=update-all&t=' + Date.now(), { cache: 'no-store' });
          const j = await r.json();
          const summary = j?.summary || { ok: 0, error: 0, total: 0 };
          if (typeof refetchIndiaMacro === 'function') refetchIndiaMacro();
          setSyncState({ status: 'complete', summary, error: null, startedAt: null });
          window.setTimeout(() => setSyncState(prev => prev.status === 'complete' ? { status: 'idle', summary: null, error: null, startedAt: null } : prev), 8000);
        } catch (e) {
          setSyncState({ status: 'error', summary: null, error: String(e), startedAt: null });
          window.setTimeout(() => setSyncState(prev => prev.status === 'error' ? { status: 'idle', summary: null, error: null, startedAt: null } : prev), 8000);
        }
      }, [syncState.status, refetchIndiaMacro]);

      // Hooks must run unconditionally. Compute on each render even before data lands.
      const niftySeries = (indiaMacro?.niftyClose && indiaMacro.niftyClose.length > 0)
        ? indiaMacro.niftyClose
        : niftyFallback;

      useEffect(() => {
        if (!indiaMacro) return;
        if (indiaMacro?.niftyClose && indiaMacro.niftyClose.length > 0) return;
        if (niftyFallback) return;
        fetch('https://urmzsefnlyfnalxckefm.supabase.co/functions/v1/nse-data-proxy?mode=get-data&index=nifty50')
          .then(r => r.json())
          .then(rows => {
            if (!Array.isArray(rows)) return;
            const series = rows.map(r => ({ date: r[0], value: r[4] })).filter(p => p.value != null && p.value > 0);
            setNiftyFallback(series);
          })
          .catch(() => {});
      }, [indiaMacro, niftyFallback]);

      const regime = useMemo(() => {
        const iipYoy = indiaMacro?.industrial?.iip?.yoy;
        const cpiYoy = indiaMacro?.inflation?.cpi?.yoy;
        const spread = indiaMacro?.inflation?.yieldSpread?.value;
        // Phase 9.1 — Pull business-cycle metrics for capex/deleveraging detection.
        const bc = indiaMacro?.businessCycle || {};
        const capUtilVal     = bc.capUtil?.status === 'ok' ? bc.capUtil?.value : null;          // <75% = slack, capex won't accelerate
        const roeSpreadVal   = bc.roeGsecSpread?.status === 'ok' ? bc.roeGsecSpread?.value : null; // tight (<3%) = bank ROEs compressed
        // Rate-of-Change momentum proxy — Nifty Auto YoY (sector demand).
        const autoYoY        = indiaMacro?.highFreq?.autoIndexYoY?.yoy ?? null;
        const consumptionAccel = autoYoY != null && autoYoY >= 10; // accelerating consumption
        const consumptionWeak  = autoYoY != null && autoYoY <= 0;  // contracting

        if (iipYoy == null || cpiYoy == null || spread == null) {
          return { id: 'unknown', label: 'Insufficient Data', color: C.textMut, tone: 'Awaiting fresh macro prints from FRED.', signal: '—', tilt: null };
        }
        const growthHot = iipYoy >= 4;
        const inflationHot = cpiYoy >= 5;
        const curveSteep = spread >= 1.0;

        // Phase 9.1 — Capex/Deleveraging override: triggers Banks underweight regardless of headline growth.
        // Fires when Capacity Utilisation is materially below trend (<75%) AND ROE-GSec spread is tight (<3%),
        // i.e. corporates won't borrow to add capacity and banks lack the rate edge to expand credit profitably.
        const capexBlocked = (capUtilVal != null && capUtilVal < 75) && (roeSpreadVal != null && roeSpreadVal < 3);
        if (capexBlocked) {
          return { id: 'low_capex', label: 'Low Capex / Deleveraging', color: C.amber, tone: 'Capacity slack with thin ROE-over-G-Sec edge — corporates park, banks compress. Underweight banks & capital goods; rotate into FMCG, Pharma, IT.', signal: `CapUtil ${capUtilVal}% · ROE−GSec ${roeSpreadVal}%`, tilt: consumptionAccel ? 'consumption_accel' : (consumptionWeak ? 'consumption_weak' : null) };
        }

        const tilt = consumptionAccel ? 'consumption_accel' : (consumptionWeak ? 'consumption_weak' : null);
        if (growthHot && !inflationHot && curveSteep)
          return { id: 'expansion', label: 'Expansion', color: C.green, tone: 'Growth accelerating with inflation contained and a steep curve. Cyclicals, financials, and capex plays favoured.', signal: 'IIP↑ · CPI controlled · Steep curve', tilt };
        if (growthHot && inflationHot)
          return { id: 'stagflation', label: 'Stagflation', color: C.red, tone: 'Growth holding up but inflation sticky. Pricing-power and commodity plays outperform; rate-sensitive names lag.', signal: 'IIP↑ · CPI↑ · Curve flat / inverted', tilt };
        if (!growthHot && inflationHot)
          return { id: 'moderation', label: 'Moderation', color: C.amber, tone: 'Growth cooling while inflation remains warm. Quality + defensive tilt; underweight high-beta cyclicals.', signal: 'IIP→ · CPI↑ · Curve flattening', tilt };
        return { id: 'slowdown', label: 'Slowdown', color: C.cyan, tone: 'Both growth and inflation decelerating; curve flat or inverted. Classic defensive playbook leads.', signal: 'IIP↓ · CPI↓ · Curve inverted', tilt };
      }, [indiaMacro]);

      const STRATEGY_MATRIX = [
        { regime: 'expansion', label: 'Expansion',  overweight: 'Banks · Capital Goods · Auto · Metals · Realty', underweight: 'FMCG · Pharma · Utilities',          alpha: 4.0 },
        { regime: 'moderation', label: 'Moderation', overweight: 'IT · Pharma · Healthcare · Insurance',          underweight: 'Metals · Realty · Smallcaps',          alpha: 1.5 },
        { regime: 'slowdown',  label: 'Slowdown',   overweight: 'FMCG · Pharma · Large-cap IT · Utilities',       underweight: 'Auto · Metals · Realty · NBFCs',       alpha: 3.5 },
        { regime: 'stagflation', label: 'Stagflation', overweight: 'Energy · Commodities · USD-hedged IT · Gold',  underweight: 'Auto · Banks · Discretionary',         alpha: 2.0 },
        // Phase 9.1 — Capex/Deleveraging regime row
        { regime: 'low_capex', label: 'Low Capex / Deleveraging', overweight: 'FMCG · Pharma · IT · Utilities',  underweight: 'Banks · NBFCs · Capital Goods · Auto', alpha: 1.0 },
      ];

      // Phase 9.2 — Map regime.overweight keyword phrases → daily_eyby_data sector index_ids.
      // Returns array of ids that have monthly close benchmarks available on the backend.
      const SECTOR_KEYWORD_MAP = {
        'banks':         'nifty-bank',
        'nbfc':          'nifty-fin-service',
        'insurance':     'nifty-fin-service',
        'capital goods': 'nifty-infra',
        'auto':          'nifty-auto',
        'metals':        'nifty-metal',
        'realty':        'nifty-realty',
        'fmcg':          'nifty-fmcg',
        'pharma':        'nifty-pharma',
        'healthcare':    'nifty-pharma',
        'utilities':     'nifty-energy',
        'energy':        'nifty-energy',
        'commodities':   'nifty-commodities',
        'large-cap it':  'nifty-it',
        'usd-hedged it': 'nifty-it',
        'it ':           'nifty-it',
      };
      function parseOverweightToIds(overweightText) {
        if (!overweightText) return [];
        const t = (' ' + overweightText.toLowerCase() + ' ').replace(/·/g, ' ');
        const matched = new Set();
        for (const [kw, id] of Object.entries(SECTOR_KEYWORD_MAP)) { if (t.includes(kw)) matched.add(id); }
        return Array.from(matched);
      }
      function cagrFromSeries(points, yrs) {
        if (!points || points.length < 2) return null;
        const last = points[points.length - 1];
        const targetDate = new Date(last.date); targetDate.setFullYear(targetDate.getFullYear() - yrs);
        const targetIso = targetDate.toISOString().split('T')[0];
        // Find the earliest entry on/after the target date (binary search since sorted).
        let lo = 0, hi = points.length - 1, idx = -1;
        while (lo <= hi) { const m = (lo + hi) >> 1; if (points[m].date >= targetIso) { idx = m; hi = m - 1; } else lo = m + 1; }
        if (idx < 0 || idx >= points.length - 1) return null;
        const start = points[idx];
        const startVal = start.close ?? start.value;
        const lastVal  = last.close  ?? last.value;
        if (!startVal || !lastVal || startVal <= 0) return null;
        const actualYrs = (new Date(last.date).getTime() - new Date(start.date).getTime()) / 31557600000;
        if (actualYrs < 0.4) return null;
        return { cagr: (Math.pow(lastVal / startVal, 1 / actualYrs) - 1) * 100, actualYrs, startDate: start.date, endDate: last.date };
      }

      const backtest = useMemo(() => {
        if (!niftySeries || niftySeries.length === 0) return null;
        const yrs = { '1Y': 1, '3Y': 3, '5Y': 5, '10Y': 10 }[backtestPeriod] || 5;
        // Nifty 50 baseline CAGR — same engine over the same window.
        const niftyRes = cagrFromSeries(niftySeries, yrs);
        if (!niftyRes) return null;
        // Phase 9.2 — Dynamic strategy basket CAGR: average N-year CAGRs of the active regime's overweight sectors.
        const benchmarks = indiaMacro?.sectorBenchmarks || {};
        const overweightIds = parseOverweightToIds(STRATEGY_MATRIX.find(r => r.regime === regime.id)?.overweight || '');
        const componentCagrs = [];
        const componentDetails = [];
        for (const id of overweightIds) {
          const series = benchmarks[id]; if (!series || series.length < 4) continue;
          const r = cagrFromSeries(series, yrs); if (r == null) continue;
          componentCagrs.push(r.cagr);
          componentDetails.push({ id, cagr: +r.cagr.toFixed(2), actualYrs: +r.actualYrs.toFixed(1) });
        }
        const strategyCagr = componentCagrs.length > 0 ? componentCagrs.reduce((s, x) => s + x, 0) / componentCagrs.length : null;
        const alpha = strategyCagr != null ? +(strategyCagr - niftyRes.cagr).toFixed(2) : null;
        return {
          niftyCagr: +niftyRes.cagr.toFixed(2),
          strategyCagr: strategyCagr != null ? +strategyCagr.toFixed(2) : null,
          alpha,
          startDate: niftyRes.startDate,
          endDate: niftyRes.endDate,
          actualYrs: +niftyRes.actualYrs.toFixed(1),
          basket: componentDetails,
          basketIds: overweightIds,
        };
      }, [niftySeries, backtestPeriod, regime, indiaMacro]);

      if (!indiaMacro) {
        return (<div style={{ padding: '60px 24px', textAlign: 'center', color: C.textMut, fontSize: 14 }}>Loading India macro data…</div>);
      }

      const sliceFilter = (arr) => applyPeriodFilter(arr || [], period, customStartISO);
      const fmtPct = (v) => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
      const fmtVal = (v) => v == null ? '—' : (+v).toFixed(2);
      const tone = (v) => v == null ? C.textMut : v >= 0 ? C.green : C.red;
      const sourceTagFromUrl = (u) => {
        if (!u) return 'SRC';
        if (u.includes('fred.stlouisfed.org')) return 'FRED';
        if (u.includes('finance.yahoo')) return 'Yahoo';
        if (u.includes('rbi.org') || u.includes('dbie.rbi')) return 'RBI';
        if (u.includes('mospi')) return 'MoSPI';
        if (u.includes('nsdl')) return 'NSDL';
        if (u.includes('pmi.spglobal') || u.includes('pmi')) return 'PMI';
        if (u.includes('ccilindia')) return 'CCIL';
        if (u.includes('niftyindices') || u.includes('nseindia')) return 'NSE';
        return 'SRC';
      };

      // Phase 9.2 — Slice cell.series by the global time toggle so sparklines react in lock-step with sector charts.
      // Period mapping: 1Y/3Y/5Y/10Y/MAX → trailing months/days from the latest observation.
      const slicedSeries = (series) => {
        if (!Array.isArray(series) || series.length === 0) return [];
        const yrs = { '1Y': 1, '3Y': 3, '5Y': 5, '10Y': 10 }[period];
        if (!yrs) return series; // MAX or custom — return full series
        const last = series[series.length - 1];
        if (!last || !last.date) return series;
        const cutoff = new Date(last.date); cutoff.setFullYear(cutoff.getFullYear() - yrs);
        const cutoffIso = cutoff.toISOString().split('T')[0];
        return series.filter(p => p.date >= cutoffIso);
      };

      const Cell = ({ cell, suffix, invertTone }) => {
        if (!cell) return null;
        const isNA = cell.status !== 'ok' || (cell.value == null && cell.yoy == null);
        const big = cell.yoy != null ? fmtPct(cell.yoy) : (cell.value != null ? fmtVal(cell.value) + (suffix || '') : 'N/A');
        const valueColor = isNA ? C.textMut : (cell.yoy != null ? tone(invertTone ? -cell.yoy : cell.yoy) : C.text);
        // Phase 9.2 — Sparkline data (sliced by global time toggle).
        const sparkData = !isNA ? slicedSeries(cell.series) : [];
        const sparkColor = invertTone ? (cell.yoy != null && cell.yoy < 0 ? C.green : C.red) : (cell.yoy != null && cell.yoy >= 0 ? C.green : C.red);
        const isFallback = cell.provenance === 'fallback';
        return (
          <div style={{ padding: 16, borderRadius: 10, background: '#fff', border: '1px solid ' + C.border, minHeight: 108 }}>
            <div style={{ fontSize: 10, color: C.textMut, textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 600 }}>
              {cell.label}
              {cell.sourceUrl && (
                <a href={cell.sourceUrl} target="_blank" rel="noopener noreferrer" style={{ color: isFallback ? '#d97706' : '#64748b', fontSize: 10, textDecoration: 'none', marginLeft: 6, fontWeight: isFallback ? 700 : 500 }} title={isFallback ? 'Primary FRED ID empty — using fallback proxy' : undefined}>
                  [{sourceTagFromUrl(cell.sourceUrl)}{isFallback ? '·FALLBACK' : ''}]
                </a>
              )}
            </div>
            <div className="mono" style={{ fontSize: 22, fontWeight: 700, color: valueColor, marginTop: 4 }}>{isNA ? 'N/A' : big}</div>
            {!isNA && cell.value != null && cell.yoy != null && (
              <div style={{ fontSize: 11, color: C.textMut, marginTop: 2 }}>Latest: <span className="mono">{fmtVal(cell.value)}{suffix || ''}</span>{cell.date ? ' · ' + cell.date : ''}</div>
            )}
            {sparkData.length >= 4 && (
              <div style={{ marginTop: 6, height: 32, opacity: 0.9 }}>
                <ResponsiveContainer width="100%" height="100%">
                  <ComposedChart data={sparkData} margin={{ top: 2, right: 2, bottom: 2, left: 2 }}>
                    <YAxis hide domain={['dataMin', 'dataMax']} />
                    <XAxis hide dataKey="date" />
                    <Line type="monotone" dataKey="value" stroke={sparkColor} strokeWidth={1.4} dot={false} isAnimationActive={false} />
                  </ComposedChart>
                </ResponsiveContainer>
              </div>
            )}
            {cell.source && <div style={{ fontSize: 10, color: C.textMut, marginTop: 6, fontStyle: 'italic', lineHeight: 1.4 }}>{cell.source}</div>}
          </div>
        );
      };

      const Box = ({ title, columns, children }) => (
        <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: 20, marginBottom: 20 }}>
          <div style={{ fontSize: 13, color: C.text, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 12 }}>{title}</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(' + (columns || 3) + ', 1fr)', gap: 12 }}>{children}</div>
        </div>
      );

      const g = indiaMacro.growth || {};
      const ind = indiaMacro.industrial || {};
      const inf = indiaMacro.inflation || {};
      const bnk = indiaMacro.banking || {};
      const ext = indiaMacro.external || {};

      return (
        <div>
          {/* Phase 10.2 — Header strip with title + Force System Sync trigger. */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 12, marginBottom: 6 }}>
            <div>
              <h2 style={{ fontSize: 22, fontWeight: 700, color: C.text, margin: '0 0 6px' }}>India Macro Hub</h2>
              <p style={{ fontSize: 13, color: C.textMut, margin: '0 0 0' }}>
                Phase 9 institutional pipeline · <span className="mono" style={{ color: C.textSec }}>{indiaMacro.deploy_version || 'v62'}</span> · Live FRED + Yahoo proxies with graceful 'N/A' fallback when a source rate-limits.
              </p>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
              <button
                onClick={forceSync}
                disabled={syncState.status === 'running'}
                className="mono"
                style={{
                  padding: '8px 14px', fontSize: 12, fontWeight: 700, borderRadius: 8, cursor: syncState.status === 'running' ? 'wait' : 'pointer',
                  border: '1px solid ' + (syncState.status === 'error' ? C.red : syncState.status === 'complete' ? C.green : C.cyan),
                  background: syncState.status === 'error' ? C.red + '12' : syncState.status === 'complete' ? C.green + '12' : C.cyan + '12',
                  color: syncState.status === 'error' ? C.red : syncState.status === 'complete' ? C.green : C.cyan,
                  display: 'inline-flex', alignItems: 'center', gap: 6,
                  opacity: syncState.status === 'running' ? 0.85 : 1,
                  transition: 'all 0.15s ease',
                }}
                title="Phase 10.2 — Force a fresh fault-tolerant pass over every Indian + Global index and Macro Hub block. Jittered 200-500ms between items to bypass rate limits."
              >
                {syncState.status === 'running' && (<span style={{ width: 12, height: 12, border: '2px solid ' + C.cyan + '50', borderTopColor: C.cyan, borderRadius: '50%', animation: 'spin 0.8s linear infinite', display: 'inline-block' }} />)}
                {syncState.status === 'complete' && '✓ '}
                {syncState.status === 'error' && '✗ '}
                {syncState.status === 'running' ? 'Syncing…' : syncState.status === 'complete' ? 'Sync Complete' : syncState.status === 'error' ? 'Sync Failed' : '⟳ Force System Sync'}
              </button>
              {syncState.status === 'complete' && syncState.summary && (
                <div className="mono" style={{ fontSize: 10, color: C.textMut, textAlign: 'right' }}>
                  {syncState.summary.ok}/{syncState.summary.total} indices refreshed in {Math.round((syncState.summary.durationMs || 0)/1000)}s
                  {syncState.summary.error > 0 && <span style={{ color: C.amber }}> · {syncState.summary.error} drifted</span>}
                </div>
              )}
              {syncState.status === 'error' && syncState.error && (
                <div className="mono" style={{ fontSize: 10, color: C.red, textAlign: 'right', maxWidth: 320, wordBreak: 'break-word' }}>{syncState.error}</div>
              )}
              {syncState.status === 'running' && syncState.startedAt && (
                <div className="mono" style={{ fontSize: 10, color: C.textMut, textAlign: 'right' }}>Running fault-tolerant pass · jitter 200–500ms between feeds…</div>
              )}
            </div>
          </div>
          <div style={{ height: 16 }} />

          {/* Regime Banner — auto-detected from IIP, CPI, 10Y−3M Spread */}
          <div style={{ background: regime.color + '15', border: '1px solid ' + regime.color + '60', borderRadius: 12, padding: '16px 20px', marginBottom: 8, display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 20 }}>
            <div style={{ minWidth: 180 }}>
              <div style={{ fontSize: 10, color: C.textMut, textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 600 }}>Current Macro Regime</div>
              <div className="mono" style={{ fontSize: 24, fontWeight: 700, color: regime.color, marginTop: 4 }}>{regime.label}</div>
            </div>
            <div style={{ flex: '1 1 320px', minWidth: 240 }}>
              <div style={{ fontSize: 13, color: C.textSec, lineHeight: 1.55 }}>{regime.tone}</div>
              <div className="mono" style={{ fontSize: 11, color: C.textMut, marginTop: 6 }}>
                Signal: {regime.signal} · IIP YoY {fmtPct(ind.iip?.yoy)} · CPI YoY {fmtPct(inf.cpi?.yoy)} · 10Y−3M {inf.yieldSpread?.value != null ? inf.yieldSpread.value.toFixed(2) + '%' : 'N/A'}

    // Phase-4: Global Macro Hub — replaces the Phase-3 sticky ribbon with 3 dedicated historical charts.
